<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Frame Studio</title>
<style>
  :root{--bg:#0f1117;--panel:#181b24;--border:#2a2e3d;--text:#e7e9f0;--muted:#8b90a3;--accent:#7854e8;--accent2:#a78bfa}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px}
  h1{font-size:18px;margin-bottom:14px}
  .wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:330px 1fr;gap:16px}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  select,input[type=color]{width:100%;background:#11131b;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px;font-size:13px}
  button{cursor:pointer;border:1px solid var(--border);border-radius:8px;background:#1d2130;color:var(--text);font-size:13px;padding:9px 12px}
  button:hover{border-color:var(--accent2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .size-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:7px}
  .size-btn{padding:10px 6px;font-size:11px;line-height:1.3;text-align:center;background:#11131b}
  .size-btn.active{background:#7854e8;color:#fff;border:2px solid #a78bfa}
  .small{font-size:11px;color:var(--muted);margin-top:8px}
  .drop{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer}
  .drop.hover{border-color:var(--accent2);color:var(--text)}
  #exportBtn{width:100%;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  #exportBtn:hover{background:#8a68f0}
  .preview-box{background:#000;border:1px solid var(--border);border-radius:12px;min-height:340px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{max-width:100%;max-height:72vh;width:auto;height:auto;display:block}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px}
  video{display:none}
</style>
</head>
<body>
<h1>🎬 Video Frame Studio</h1>
<div class="wrap">
  <div>
    <div class="panel">
      <h2>Media</h2>
      <div class="drop" id="drop">📂 Click or drop a video here<br><span class="small">MP4 · WebM · MOV</span></div>
      <input type="file" id="fileInput" accept="video/*" hidden>
      <p class="small" id="mediaInfo">No video loaded</p>
    </div>

    <div class="panel">
      <h2>Frame Size</h2>
      <label>Choose a preset</label>
      <div class="size-buttons">
        <button type="button" class="secondary size-btn" data-size="original">Original</button>
        <button type="button" class="secondary size-btn" data-size="youtube">YouTube<br>16:9</button>
        <button type="button" class="secondary size-btn active" data-size="tiktok">TikTok / Reels<br>9:16</button>
        <button type="button" class="secondary size-btn" data-size="instagram-square">Instagram Post<br>1:1</button>
        <button type="button" class="secondary size-btn" data-size="instagram-story">Instagram Story<br>9:16</button>
      </div>
      <p class="small" id="frameSizeInfo">TikTok / Reels / Shorts — 720 × 1280</p>

      <label>Video positioning</label>
      <select id="fit">
        <option value="contain">Fit — show full video</option>
        <option value="cover">Fill — crop edges</option>
      </select>

      <label>Background color (empty areas)</label>
      <input type="color" id="bgColor" value="#000000">
    </div>

    <div class="panel">
      <h2>Export</h2>
      <button id="exportBtn" disabled>⬇ Export video</button>
      <p class="small" id="exportInfo">Load a video to enable export.</p>
    </div>
  </div>

  <div class="preview-box" id="previewBox">
    <p class="empty" id="emptyMsg">Load a video to see the preview</p>
    <canvas id="canvas" hidden></canvas>
  </div>
</div>

<video id="preview" playsinline></video>

<script>
const $=id=>document.getElementById(id);
const preview=$("preview"),canvas=$("canvas"),ctx=canvas.getContext("2d");

/* ---------- Frame size presets ---------- */
const FRAME_SIZES={
  original:null,
  youtube:[1920,1080],
  tiktok:[720,1280],
  "instagram-square":[1080,1080],
  "instagram-story":[1080,1920]
};
const FRAME_NAMES={
  original:"Original video size",
  youtube:"YouTube — 1920 × 1080",
  tiktok:"TikTok / Reels / Shorts — 720 × 1280",
  "instagram-square":"Instagram Post — 1080 × 1080",
  "instagram-story":"Instagram Story — 1080 × 1920"
};
let selectedFrameSize="tiktok";

function getFrameSize(){
  if(selectedFrameSize==="original"){
    return preview.videoWidth&&preview.videoHeight
      ?[preview.videoWidth,preview.videoHeight]
      :[1280,720];
  }
  return FRAME_SIZES[selectedFrameSize]||[720,1280];
}

function applyFrameSize(size){
  if(!FRAME_SIZES.hasOwnProperty(size))return;
  selectedFrameSize=size;
  document.querySelectorAll(".size-btn").forEach(b=>{
    b.classList.toggle("active",b.dataset.size===size);
  });
  const[w,h]=getFrameSize();
  $("frameSizeInfo").textContent=FRAME_NAMES[size]+" — "+w+" × "+h;
  updateFrame();
}

document.querySelectorAll(".size-btn").forEach(button=>{
  button.onclick=()=>applyFrameSize(button.dataset.size);
});

/* kept so any existing code calling these still works */
function canvasSize(){return getFrameSize()}
function frameRatio(){const[w,h]=getFrameSize();return w/h}

/* ---------- Drawing ---------- */
function drawFrame(c,w,h){
  c.fillStyle=$("bgColor").value;
  c.fillRect(0,0,w,h);
  if(!preview.videoWidth)return;
  const vw=preview.videoWidth,vh=preview.videoHeight;
  const scale=$("fit").value==="contain"
    ?Math.min(w/vw,h/vh)
    :Math.max(w/vw,h/vh);
  c.drawImage(preview,(w-vw*scale)/2,(h-vh*scale)/2,vw*scale,vh*scale);
}

function updateFrame(){
  const[w,h]=canvasSize();
  canvas.width=w;
  canvas.height=h;
  drawFrame(ctx,w,h);
}

 $("fit").onchange=updateFrame;
 $("bgColor").oninput=()=>drawFrame(ctx,canvas.width,canvas.height);

/* live preview loop */
(function loop(){
  if(canvas.width)drawFrame(ctx,canvas.width,canvas.height);
  requestAnimationFrame(loop);
})();

/* ---------- Load video ---------- */
 $("drop").onclick=()=>$("fileInput").click();
 $("fileInput").onchange=e=>{const f=e.target.files[0];if(f)loadVideo(f)};
["dragover","dragleave","drop"].forEach(ev=>{
  $("drop").addEventListener(ev,e=>{
    e.preventDefault();
    $("drop").classList.toggle("hover",ev==="dragover");
    if(ev==="drop"){const f=e.dataTransfer.files[0];if(f)loadVideo(f)}
  });
});

let objectUrl=null;
function loadVideo(file){
  if(objectUrl)URL.revokeObjectURL(objectUrl);
  objectUrl=URL.createObjectURL(file);
  preview.src=objectUrl;
  preview.load();
}

preview.addEventListener("loadedmetadata",()=>{
  canvas.hidden=false;
  $("emptyMsg").hidden=true;
  const dur=isFinite(preview.duration)?preview.duration.toFixed(1)+"s":"?";
  $("mediaInfo").textContent=preview.videoWidth+" × "+preview.videoHeight+" • "+dur;
  $("exportBtn").disabled=false;
  $("exportInfo").textContent="Ready to export.";
  if(selectedFrameSize==="original")applyFrameSize("original");
  else updateFrame();
});

/* ---------- Export ---------- */
let exporting=false,audioCtx=null,audioHooked=false;

 $("exportBtn").onclick=async()=>{
  if(exporting||!preview.videoWidth)return;
  exporting=true;
  $("exportBtn").disabled=true;

  const[w,h]=canvasSize();
  const ec=document.createElement("canvas");
  ec.width=w;ec.height=h;
  const ectx=ec.getContext("2d");
  drawFrame(ectx,w,h);

  const stream=ec.captureStream(30);

  /* attach audio (once) */
  try{
    if(!audioHooked){
      audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      const src=audioCtx.createMediaElementSource(preview);
      const dest=audioCtx.createMediaStreamDestination();
      src.connect(dest);
      src.connect(audioCtx.destination);
      audioCtx._dest=dest;
      audioHooked=true;
    }
    if(audioCtx.state==="suspended")audioCtx.resume();
    audioCtx._dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  }catch(err){console.warn("Audio capture unavailable:",err)}

  const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
    ?"video/webm;codecs=vp9,opus":"video/webm";
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});
  const chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:"video/webm"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="frame-"+selectedFrameSize+"-"+w+"x"+h+".webm";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    exporting=false;
    $("exportBtn").disabled=false;
    $("exportInfo").textContent="Export finished ✓ ("+w+" × "+h+")";
  };

  preview.currentTime=0;
  try{await preview.play()}catch(err){
    exporting=false;$("exportBtn").disabled=false;
    $("exportInfo").textContent="Press play on the preview first, then export.";
    return;
  }

  rec.start(250);
  $("exportInfo").textContent="Recording… keep this tab open until the video ends.";

  (function drawLoop(){
    drawFrame(ectx,w,h);
    if(!preview.ended&&exporting)requestAnimationFrame(drawLoop);
  })();

  preview.onended=()=>{
    if(rec.state!=="inactive")rec.stop();
  };
};

/* ---------- Init ---------- */
updateFrame();
applyFrameSize("tiktok");
</script>
</body>
</html>
