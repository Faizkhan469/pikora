<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Free Online Photo Editor – Edit Photos Without Watermarks | Pikora</title>
<meta name="theme-color" content="#0b1020">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--bg:#eef1f5;--panel:#ffffff;--border:#e2e6ed;--hover:#eceff4;--accent:#0099c0;--text:#1b1f27;--muted:#6b7280;--onacc:#ffffff;--track:#f6f8fb;--dots:#d8dee7;--toolbar:#ffffff}
body.dark{--bg:#0a0a0c;--panel:#151518;--border:#27272a;--hover:#27272a;--accent:#00e5ff;--text:#f4f4f5;--muted:#a1a1aa;--onacc:#000;--track:#0f0f12;--dots:#1a1a1f;--toolbar:#151518}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
input[type=text],input[type=number],textarea{-webkit-user-select:text;user-select:text}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.topbar{height:48px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:50;gap:6px}
.topbar-left{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo{font-weight:800;font-size:16px;color:var(--accent);letter-spacing:1px;text-decoration:none}
.topbar-center{display:flex;gap:2px;flex:1;justify-content:center}
.topbar-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tool-btn{background:transparent;border:none;color:var(--muted);padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tool-btn:hover:not(:disabled){background:var(--hover);color:var(--text)}
.tool-btn:disabled{opacity:.4;cursor:not-allowed}
.btn-export{background:var(--accent);color:var(--onacc);border:none;padding:7px 14px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.btn-export:hover{filter:brightness(.92)}
.workspace{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0}
.stage-area{flex:1;min-height:0;background:var(--bg);display:flex;flex-direction:column;position:relative}
.canvas-container{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;position:relative;background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:20px 20px}
#canvas,#showCanvas{display:block;touch-action:none;cursor:grab;box-shadow:0 12px 40px rgba(0,0,0,.28);border-radius:3px;background:#000}
#showCanvas{cursor:default}
#placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;padding:12px;background:var(--panel);border:2px dashed var(--border);border-radius:6px}
#placeholder .plus{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--onacc);font-size:30px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
#placeholder b{font-size:15px}#placeholder small{color:var(--muted);font-size:12px}
.ratio-chip{position:absolute;left:8px;top:8px;z-index:3;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:2px 4px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ratio-chip select{background:transparent;border:none;color:var(--text);font-size:12px;font-weight:600;padding:4px;cursor:pointer;max-width:130px}
.info{position:absolute;right:8px;top:10px;font-size:11px;color:var(--muted);z-index:3}
.status{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:var(--muted);pointer-events:none;padding:0 12px}
body.dragging .stage-area{outline:3px dashed var(--accent);outline-offset:-6px}
.eyedropper-banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--accent);color:var(--onacc);padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;z-index:9;display:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.eyedropper-banner.show{display:block}
.crop-toolbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;gap:6px;z-index:9;background:var(--panel);padding:6px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);border:1px solid var(--border)}
.crop-toolbar.show{display:flex}
.crop-toolbar button{padding:8px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:700}
.crop-toolbar .ok{background:var(--accent);color:var(--onacc)}
.crop-toolbar .cancel{background:var(--hover);color:var(--text)}
.safe-zone{position:absolute;inset:0;pointer-events:none;z-index:5;border:2px dashed rgba(255,0,180,.5);border-radius:6px;display:none}
.safe-zone.show{display:block}
.safe-zone::after{content:"Safe zone";position:absolute;left:8px;bottom:8px;background:rgba(255,0,180,.7);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.panel-drawer{position:fixed;left:0;right:0;bottom:56px;background:var(--panel);border-top:1px solid var(--border);border-radius:16px 16px 0 0;z-index:200;height:min(60vh,420px);display:flex;flex-direction:column;transform:translateY(calc(100% + 56px));transition:transform .28s cubic-bezier(.22,1,.36,1);box-shadow:0 -10px 40px rgba(0,0,0,.25);overflow:hidden;pointer-events:auto}
.panel-drawer.open{transform:translateY(0)}
.panel-drawer-handle{padding:8px;display:flex;justify-content:center;cursor:pointer;flex-shrink:0}
.panel-drawer-handle::after{content:"";width:40px;height:4px;background:var(--border);border-radius:2px}
.panel-drawer-title{padding:0 16px 10px;font-size:14px;font-weight:700;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.panel-drawer-close{background:var(--hover);border:none;color:var(--text);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px}
.panel-drawer-body{flex:1 1 auto;min-height:100px;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch;display:block}
.bottom-toolbar{height:56px;flex-shrink:0;background:var(--toolbar);border-top:1px solid var(--border);display:flex;overflow-x:auto;overflow-y:hidden;z-index:250;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bottom-toolbar::-webkit-scrollbar{display:none}
.btool{flex:0 0 auto;min-width:64px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:none;color:var(--muted);font-size:9.5px;cursor:pointer;padding:0 8px;border-top:2px solid transparent;transition:color .15s,border-color .15s;font-family:inherit;font-weight:600}
.btool span{font-size:18px;line-height:1}
.btool:hover{color:var(--text);background:var(--hover)}
.btool.active{color:var(--accent);border-top-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.panel-content h3{font-size:12px;margin:12px 0 6px;color:var(--text)}
.panel-content hr{border:0;border-top:1px solid var(--border);margin:12px 0}
.panel-content label{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px;font-weight:600}
.panel-content input[type=text],.panel-content input[type=number],.panel-content select,.panel-content textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:6px;font-size:14px;margin-bottom:6px;font-family:inherit;min-height:38px}
.panel-content textarea{min-height:80px;resize:vertical}
.panel-content input[type=color]{width:100%;height:38px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:2px}
.panel-content input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 8px;height:28px}
.panel-content input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.checkline{display:flex;align-items:center;gap:8px;margin:6px 0 8px}
.checkline label{margin:0;font-size:12px;color:var(--text)}
.range-value{float:right;color:var(--muted);font-size:11px}
.panel-content button.act{width:100%;background:var(--accent);color:var(--onacc);border:none;padding:11px;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;margin-top:4px;min-height:42px}
.panel-content button.act:hover{filter:brightness(.92)}
.panel-content button.sec{width:100%;background:var(--hover);color:var(--text);border:none;padding:11px;border-radius:6px;font-size:12px;cursor:pointer;margin-top:4px;min-height:42px}
.panel-content button.sec:hover:not(:disabled){filter:brightness(.93)}
.panel-content button.dan{background:#dc2626;color:#fff}
.panel-content button:disabled{opacity:.4;cursor:not-allowed}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.color-row{display:grid;grid-template-columns:1fr 40px;gap:6px;align-items:start}
.color-row .pick{width:40px;height:40px;border:none;border-radius:6px;background:var(--hover);color:var(--text);cursor:pointer;font-size:16px}
.color-row .pick.active{background:var(--accent);color:var(--onacc)}
.note{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.selected-info{background:var(--bg);border:1px solid var(--border);padding:10px;border-radius:8px;font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.upload-zone{display:block;border:2px dashed var(--border);border-radius:8px;padding:20px 14px;text-align:center;color:var(--muted);cursor:pointer;background:rgba(127,127,127,.04)}
.upload-zone:hover{border-color:var(--accent);color:var(--accent)}
.upload-zone span{font-size:24px;display:block;margin-bottom:4px}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emoji-btn{background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:22px;padding:8px 0;cursor:pointer;text-align:center}
.emoji-btn:hover{border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.sel{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.list-item{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:11px}
.list-item .t{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .m{color:var(--muted);font-size:10px;margin:2px 0 4px}
.frame-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.frame-card{background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:4px;cursor:pointer;text-align:center;font-size:9.5px;color:var(--muted)}
.frame-card canvas{display:block;width:100%;height:auto;border-radius:4px;margin-bottom:3px}
.frame-card:hover{border-color:var(--accent)}
.frame-card.sel{border-color:var(--accent);color:var(--accent);font-weight:700}
.online-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.online-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px;font-size:10px}
.online-card img{width:100%;height:92px;object-fit:contain;background:repeating-conic-gradient(#8883 0 25%,transparent 0 50%) 0 0/12px 12px;border-radius:4px;display:block}
.online-card .t{margin:4px 0 2px;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.online-card .m{color:var(--muted);margin-bottom:4px;font-size:9.5px}
.online-card .g2 button{padding:6px;min-height:34px;margin-top:0}
.hash{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:11px;margin:3px;cursor:pointer;color:var(--text)}
.hash:hover{border-color:var(--accent);color:var(--accent)}
.strip{flex-shrink:0;background:var(--panel);border-top:1px solid var(--border);display:flex;flex-direction:column;max-height:160px}
.strip-bar{min-height:42px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;gap:6px;flex-wrap:nowrap;overflow-x:auto}
.time-display{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;flex:1}
.slides{flex:1;display:flex;gap:8px;overflow-x:auto;padding:8px;align-items:center;background:var(--track);min-height:60px}
.slide{position:relative;flex:0 0 auto;height:60px;border-radius:6px;overflow:hidden;border:1px solid var(--border);background:#000}
.slide img{height:100%;display:block}
.slide .n{position:absolute;left:4px;top:3px;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
.slide .sa{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:rgba(0,0,0,.55)}
.slide .sa button{background:none;border:none;color:#fff;font-size:11px;padding:3px 6px;cursor:pointer}
.tl-hint{color:var(--muted);font-size:12px;padding:0 6px;white-space:nowrap}
.toast{position:fixed;top:60px;right:12px;background:#fbbf24;color:#000;padding:12px 16px;border-radius:8px;font-size:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:300;display:none;max-width:min(300px,86vw)}
.toast.show{display:block}
input[type=file]{display:none}
@media(max-width:700px){
  .topbar{height:44px;padding:0 8px}
  .logo{font-size:15px}
  .btn-export{padding:6px 12px;font-size:11px}
  .tool-btn{padding:5px 6px;font-size:11px}
  .bottom-toolbar{height:54px}
  .btool{min-width:58px;font-size:9px;padding:0 6px}
  .btool span{font-size:17px}
  .panel-drawer{bottom:54px;height:min(65vh,460px);transform:translateY(calc(100% + 54px))}
  .canvas-container{padding:6px}
  .strip{max-height:140px}
  .slide{height:52px}
}
</style>
</head>
<body>
<h1 class="sr">Free Online Photo Editor</h1>
<header class="topbar">
  <div class="topbar-left"><a class="logo" href="index.html">PIKORA</a></div>
  <div class="topbar-center">
    <button class="tool-btn" id="undo" disabled type="button">↶ Undo</button>
    <button class="tool-btn" id="redo" disabled type="button">↷ Redo</button>
  </div>
  <div class="topbar-right">
    <button class="tool-btn" id="themeBtn" type="button">🌙</button>
    <button class="btn-export" id="goSave" type="button">Save</button>
  </div>
</header>
<div class="workspace">
  <main class="stage-area">
    <div class="canvas-container" id="canvasArea">
      <div class="ratio-chip"><select id="crop" title="Canvas ratio">
        <option value="original">Original</option>
        <option value="1:1">1:1 Square</option>
        <option value="4:5">4:5 Portrait</option>
        <option value="4:3">4:3 Landscape</option>
        <option value="16:9">16:9 Widescreen</option>
        <option value="3:4">3:4 Portrait</option>
        <option value="9:16" selected>9:16 Story</option>
      </select></div>
      <div class="info" id="imageInfo">No image</div>
      <div class="eyedropper-banner" id="eyedropperBanner">🎨 Click on the photo to pick a colour</div>
      <div class="crop-toolbar" id="cropToolbar">
        <button class="ok" id="cropApply" type="button">✓ Apply crop</button>
        <button class="cancel" id="cropCancel" type="button">Cancel</button>
      </div>
      <div class="safe-zone" id="safeZoneOverlay"></div>
      <label id="placeholder" for="upload"><span class="plus">+</span><b>Click to upload</b><small>Or drag and drop</small></label>
      <canvas id="canvas" hidden></canvas>
      <canvas id="showCanvas" hidden></canvas>
      <div class="status" id="status">Ready to edit.</div>
    </div>
    <div class="strip">
      <div class="strip-bar">
        <button class="tool-btn" id="addSlideBtn" type="button">＋ Add to video</button>
        <button class="tool-btn" id="previewShowBtn" type="button">▶ Preview</button>
        <button class="tool-btn" id="stopShowBtn" type="button" hidden>■ Stop</button>
        <span class="time-display" id="stripInfo">No photos yet</span>
        <a class="btn-export" id="showDownload" hidden download="pikora-photo-video.webm">⬇ Download</a>
        <button class="btn-export" id="exportShowBtn" type="button">🎬 Make video</button>
      </div>
      <div class="slides" id="slidesRow"></div>
    </div>
  </main>
</div>
<div class="panel-drawer" id="panelDrawer">
  <div class="panel-drawer-handle" id="drawerHandle"></div>
  <div class="panel-drawer-title" id="drawerTitle">
    <span id="drawerTitleText">Panel</span>
    <button class="panel-drawer-close" id="drawerClose" type="button">✕</button>
  </div>
  <div class="panel-drawer-body panel-content" id="drawerBody"></div>
</div>
<nav class="bottom-toolbar" id="bottomToolbar">
  <button class="btool" data-panel="photo"><span>📷</span>Photo</button>
  <button class="btool" data-panel="adjust"><span>🎛️</span>Adjust</button>
  <button class="btool" data-panel="text"><span>T</span>Text</button>
  <button class="btool" data-panel="elements"><span>⭐</span>Elements</button>
  <button class="btool" data-panel="frames"><span>🖼️</span>Frames</button>
  <button class="btool" data-panel="social"><span>📱</span>Social</button>
  <button class="btool" data-panel="ai"><span>🤖</span>AI</button>
  <button class="btool" data-panel="video"><span>🎬</span>Video</button>
  <button class="btool" data-panel="layers"><span>📚</span>Layers</button>
  <button class="btool" data-panel="save"><span>💾</span>Save</button>
</nav>
<input type="file" id="upload" accept="image/jpeg,image/png,image/webp">
<input type="file" id="slidesUpload" accept="image/jpeg,image/png,image/webp" multiple>
<input type="file" id="musicFile" accept="audio/*">
<input type="file" id="logoFile" accept="image/*">
<div class="toast" id="toast"></div>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("canvas"),ctx=canvas.getContext("2d"),placeholder=$("placeholder"),statusText=$("status"),imageInfo=$("imageInfo");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmtT=t=>String(Math.floor(t/60)).padStart(2,"0")+":"+String(Math.floor(t%60)).padStart(2,"0");
const isMobile=()=>window.innerWidth<=700;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let toastTimer=null;
function setStatus(m){statusText.textContent=m}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),3800)}

/* ⚠️ PASTE YOUR PIXABAY KEY HERE ⚠️ */
const PIXABAY_KEY="58509850-72eaf8068d89ae582c6e23ad8";

let img=null,angle=0,straighten=0,flipH=false,flipV=false;
let overlays=[],outputWidth=0,outputHeight=0,selectedIndex=-1;
let cropRect=null,cropActive=false,pickTarget=null;
let undoStack=[],redoStack=[];
const HISTORY_LIMIT=50;
let draggingIndex=-1,dragOffsetX=0,dragOffsetY=0,activePointer=null;
let shadowEditStarted=false,uiScale=1;
const sliderFlags={};
const DEF_FRAME={id:"none",color:"#ffffff",color2:"#d4af37",thick:6,emoji:"🌙⭐"};
let frame={...DEF_FRAME},frameOnline=null;
const onlineCache={};
let slides=[];
let music={url:null,blob:false,dur:0,name:""};
let platform=null,safeZoneOn=false;
let currentPanel=null;
let textBold=true,textItalic=false;
let liveFor=null;

function applyTheme(d){document.body.classList.toggle("dark",d);$("themeBtn").textContent=d?"☀️":"🌙";try{localStorage.setItem("pikoraTheme",d?"dark":"light")}catch(e){}}
let startDark=false;try{startDark=localStorage.getItem("pikoraTheme")==="dark"}catch(e){}
applyTheme(startDark);$("themeBtn").onclick=()=>applyTheme(!document.body.classList.contains("dark"));

const drawer=$("panelDrawer"),drawerBody=$("drawerBody"),drawerTitleText=$("drawerTitleText");

function buildPanelHTML(panelId){
  switch(panelId){
    case "photo":return `
      <label class="upload-zone" for="upload"><span>☁️</span><strong>Upload photo</strong><br><small>JPG, PNG or WebP</small></label>
      <p class="note" id="historyInfo">Upload a photo to start editing.</p>
      <h3>✂ Crop</h3>
      <button class="sec" id="startCrop" type="button">✂ Start crop</button>
      <h3>🔄 Rotate &amp; Flip</h3>
      <div class="g2"><button class="sec" id="rotateLeft" type="button">↶ Left</button><button class="sec" id="rotateRight" type="button">↷ Right</button></div>
      <div class="g2"><button class="sec" id="flipH" type="button">↔ Flip H</button><button class="sec" id="flipV" type="button">↕ Flip V</button></div>
      <label>Straighten <span class="range-value" id="straightenValue">0°</span></label>
      <input type="range" id="straighten" min="-15" max="15" step="0.5" value="0">
      <button class="sec" id="resetStraighten" type="button">Reset straighten</button>
      <h3>📏 Resize</h3>
      <div class="g2">
        <div><label>Width</label><input type="number" id="resizeWidth" min="1" max="12000"></div>

function openPanel(panelId){
  currentPanel=panelId;
  document.querySelectorAll(".btool").forEach(b=>b.classList.toggle("active",b.dataset.panel===panelId));
  drawerTitleText.textContent=panelId.charAt(0).toUpperCase()+panelId.slice(1);
  drawerBody.innerHTML=buildPanelHTML(panelId);
  drawer.classList.add("open");
  wirePanel(panelId);
}
function closePanel(){
  currentPanel=null;
  drawer.classList.remove("open");
  document.querySelectorAll(".btool").forEach(b=>b.classList.remove("active"));
}
document.querySelectorAll(".btool").forEach(b=>{
  b.onclick=()=>{const id=b.dataset.panel;if(currentPanel===id)closePanel();else openPanel(id)};
});
$("drawerClose").onclick=closePanel;
$("drawerHandle").onclick=closePanel;
$("goSave").onclick=()=>openPanel("save");

/* WIRE */
function wirePanel(panelId){
  if(panelId==="photo"){
    $("startCrop").onclick=()=>startCrop();
    $("rotateLeft").onclick=()=>{if(!img)return;saveSnapshot();angle=(angle-90+360)%360;render()};
    $("rotateRight").onclick=()=>{if(!img)return;saveSnapshot();angle=(angle+90)%360;render()};
    $("flipH").onclick=()=>{if(!img)return;saveSnapshot();flipH=!flipH;render()};
    $("flipV").onclick=()=>{if(!img)return;saveSnapshot();flipV=!flipV;render()};
    $("straighten").addEventListener("input",e=>{if(!img)return;straighten=Number(e.target.value);$("straightenValue").textContent=straighten.toFixed(1)+"°";render()});
    $("resetStraighten").onclick=()=>{if(!img)return;saveSnapshot();straighten=0;$("straighten").value=0;$("straightenValue").textContent="0°";render()};
    $("applyResize").onclick=()=>{
      if(!img)return;const w=Number($("resizeWidth").value),h=Number($("resizeHeight").value);
      if(!Number.isInteger(w)||!Number.isInteger(h)||w<1||h<1||w>12000||h>12000){toast("Enter 1-12000");return}
      saveSnapshot();outputWidth=w;outputHeight=h;render();toast("Resized")};
    $("resetResize").onclick=()=>{if(!img)return;saveSnapshot();outputWidth=0;outputHeight=0;render()};
    updateHistoryButtons();updateResizeFields();
  }
  if(panelId==="adjust"){
    $("autoEnhance").onclick=()=>autoEnhance();
    ["brightness","contrast","saturation","temperature","sharpen","blur","vignette"].forEach(id=>{
      const el=$(id);if(!el)return;
      el.addEventListener("pointerdown",()=>{if(img)saveSnapshot()});
      el.addEventListener("input",()=>{updateRangeLabels();render()});
      el.addEventListener("dblclick",()=>{if(!img)return;saveSnapshot();el.value={brightness:100,contrast:100,saturation:100,temperature:0,sharpen:0,blur:0,vignette:0}[id];updateRangeLabels();render()});
    });
    $("filter").addEventListener("change",()=>{if(img){saveSnapshot();render()}});
    updateRangeLabels();
  }
  if(panelId==="text"){
    $("textInput").addEventListener("input",liveText);
    ["textColor","outlineColor","outlineWidth","textSize","fontFamily","textAlign","textCurve","textRotation","letterSpacing","lineSpacing","curveAmount","textShadowColor","textShadowBlur","textShadowX","textShadowY","textBgColor"].forEach(id=>{
      const el=$(id);if(!el)return;
      el.addEventListener("input",liveText);
      el.addEventListener("change",liveText);
    });
    ["textShadowEnabled","textBgEnabled"].forEach(id=>{if($(id))$(id).addEventListener("change",liveText)});
    $("textBold").addEventListener("change",liveText);
    $("textItalic").addEventListener("change",liveText);
    $("textOpacity").addEventListener("input",()=>{updateTextLabels();liveText()});
    $("applyPreset").onclick=()=>applyTextPreset();
    $("rotateTextLeft").onclick=()=>rotateText(-90);
    $("rotateTextRight").onclick=()=>rotateText(90);
    $("blackBg").onclick=()=>{if($("textBgEnabled")){$("textBgEnabled").checked=true;$("textBgColor").value="#000000";liveText()}};
    $("whiteBg").onclick=()=>{if($("textBgEnabled")){$("textBgEnabled").checked=true;$("textBgColor").value="#ffffff";liveText()}};
    $("noBg").onclick=()=>{if($("textBgEnabled")){$("textBgEnabled").checked=false;liveText()}};
    $("addText").onclick=()=>{selectedIndex=-1;liveFor=null;$("textInput").value="";$("textInput").focus()};
    $("duplicateSelected").onclick=()=>duplicateOverlay();
    $("deleteSelected").onclick=()=>deleteSelected();
    wireEyedroppers();
    updateTextLabels();
    if(selectedIndex>=0&&overlays[selectedIndex]?.type==="text")loadTextForm(selectedIndex);
  }
  if(panelId==="elements"){
    $("emojiGrid").innerHTML=EMOJIS.map(e=>`<div class="emoji-btn" onclick="addSticker('emoji','${e}')">${e}</div>`).join("");
    $("addRect").onclick=()=>addOverlay({type:"rect",color:$("shapeColor").value});
    $("addCircle").onclick=()=>addOverlay({type:"circle",color:$("shapeColor").value});
    wireEyedroppers();
  }
  if(panelId==="frames"){
    buildFrameGrid();syncFrameControls();wireEyedroppers();
    $("frameColor").addEventListener("input",()=>{if(!img)return;frame.color=$("frameColor").value;if(frame.id==="none")frame.id="solid";render();syncFrameControls()});
    $("frameColor2").addEventListener("input",()=>{if(!img)return;frame.color2=$("frameColor2").value;if(frame.id==="none")frame.id="solid";render();syncFrameControls()});
    $("frameThick").addEventListener("input",e=>{if(!img)return;frame.thick=+e.target.value;$("frameThickVal").textContent=frame.thick+"%";if(frame.id==="none")frame.id="solid";render()});
    $("frameEmoji").addEventListener("input",e=>{if(!img)return;frame.emoji=e.target.value||"⭐";if(frame.id==="none")frame.id="solid";render()});
    $("frameNone").onclick=()=>{if(!img)return;saveSnapshot();frame={...DEF_FRAME};syncFrameControls();render()};
    $("frameSearchBtn").onclick=searchFramesPixabay;
    $("frameSearch").addEventListener("keydown",e=>{if(e.key==="Enter")searchFramesPixabay()});
    $("frameTags").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("frameSearch").value=b.dataset.q;searchFramesPixabay()});
    $("frameResults").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)addFrameFromPixabay(+b.dataset.i,b.dataset.m)});
  }
  if(panelId==="social"){
    buildPlatformChips();
    $("applyPlatform").onclick=applyPlatform;
    $("showSafeZone").addEventListener("change",e=>{safeZoneOn=e.target.checked;const sz=$("safeZoneOverlay");sz.classList.toggle("show",safeZoneOn&&!!platform);if(safeZoneOn&&platform){const[sx,sy,sr,sb]=platform.safe;sz.style.left=(sx*100)+"%";sz.style.right=(sx*100)+"%";sz.style.top=(sy*100)+"%";sz.style.bottom=(sb*100)+"%"}});
    $("copyCaption").onclick=()=>{const txt=$("captionBox").value.trim();if(!txt){toast("Write caption first");return}navigator.clipboard.writeText(txt).then(()=>toast("Copied!")).catch(()=>toast("Failed"))};
    $("makeThumbnail").onclick=()=>{if(!img){toast("Upload photo first");return}saveSnapshot();outputWidth=1280;outputHeight=720;$("crop").value="16:9";render();toast("Set to 1280×720")};
    if(platform)selectPlatform(platform.key);
  }
  if(panelId==="ai"){
    $("chromaApply").onclick=chromaApply;
    $("chromaReset").onclick=chromaReset;
    $("chromaSample").onclick=chromaSample;
    $("chromaTol").addEventListener("input",()=>{$("chromaTolVal").textContent=$("chromaTol").value});
    $("chromaSoft").addEventListener("input",()=>{$("chromaSoftVal").textContent=$("chromaSoft").value});

/* HISTORY */
function makeSnapshot(){return{angle,straighten,flipH,flipV,overlays:JSON.parse(JSON.stringify(overlays)),outputWidth,outputHeight,selectedIndex,controls:{brightness:$("brightness")?.value,contrast:$("contrast")?.value,saturation:$("saturation")?.value,temperature:$("temperature")?.value,sharpen:$("sharpen")?.value,blur:$("blur")?.value,vignette:$("vignette")?.value,filter:$("filter")?.value,crop:$("crop")?.value,straighten:$("straighten")?.value},frame:{...frame},cropRect:cropRect?{...cropRect}:null,platform,safeZoneOn}}
function saveSnapshot(){if(!img)return;undoStack.push(makeSnapshot());if(undoStack.length>HISTORY_LIMIT)undoStack.shift();redoStack=[];updateHistoryButtons()}
function updateHistoryButtons(){$("undo").disabled=!undoStack.length;$("redo").disabled=!redoStack.length}
function undo(){if(!undoStack.length)return;redoStack.push(makeSnapshot());applySnapshot(undoStack.pop())}
function redo(){if(!redoStack.length)return;undoStack.push(makeSnapshot());applySnapshot(redoStack.pop())}
$("undo").onclick=undo;$("redo").onclick=redo;
function applySnapshot(s){
  angle=s.angle;straighten=s.straighten||0;flipH=s.flipH;flipV=s.flipV;
  overlays=JSON.parse(JSON.stringify(s.overlays));outputWidth=s.outputWidth;outputHeight=s.outputHeight;
  selectedIndex=s.selectedIndex??-1;if(selectedIndex>=overlays.length)selectedIndex=-1;
  cropRect=s.cropRect||null;
  frame={...s.frame};platform=s.platform||null;safeZoneOn=!!s.safeZoneOn;
  Object.entries(s.controls).forEach(([id,v])=>{if(v!==undefined&&$(id))$(id).value=v});
  updateRangeLabels();updateResizeFields();render();updateHistoryButtons();
}

/* GEOMETRY */
function getCropDimensions(){
  if(!img)return{width:0,height:0};
  if(cropRect)return{width:cropRect.sw,height:cropRect.sh};
  const ratio=$("crop").value,original=img.width/img.height;
  if(ratio==="original")return{width:img.width,height:img.height};
  const p=ratio.split(":").map(Number),target=p[0]/p[1];
  let width=img.width,height=img.height;
  if(original>target)width=height*target;else height=width/target;
  return{width,height};
}
function getBaseDimensions(){const c=getCropDimensions();return Math.abs(angle%180)===90?{width:c.height,height:c.width}:c}
function updateResizeFields(){if(!img)return;const b=getBaseDimensions();if($("resizeWidth"))$("resizeWidth").value=outputWidth||Math.round(b.width);if($("resizeHeight"))$("resizeHeight").value=outputHeight||Math.round(b.height)}
function makeBaseCanvas(){
  const crop=getCropDimensions(),base=document.createElement("canvas");
  const w=Math.max(1,Math.round(angle%180===0?crop.width:crop.height)),h=Math.max(1,Math.round(angle%180===0?crop.height:crop.width));
  base.width=w;base.height=h;
  const c=base.getContext("2d");
  c.save();c.translate(w/2,h/2);c.rotate((angle+straighten)*Math.PI/180);c.scale(flipH?-1:1,flipV?-1:1);
  let sx,sy,cw,ch;
  if(cropRect){sx=cropRect.sx;sy=cropRect.sy;cw=cropRect.sw;ch=cropRect.sh}
  else{const cr=getCropDimensions();sx=(img.width-cr.width)/2;sy=(img.height-cr.height)/2;cw=cr.width;ch=cr.height}
  c.drawImage(img,sx,sy,cw,ch,-cw/2,-ch/2,cw,ch);
  c.restore();return base;
}
function getFilter(){
  const temp=Number($("temperature")?.value)||0;
  const hue=temp>0?-temp*.15:temp*.2;
  const sep=temp>0?Math.min(40,temp*.3):0;
  return `brightness(${$("brightness")?.value||100}%) contrast(${$("contrast")?.value||100}%) saturate(${$("saturation")?.value||100}%) blur(${$("blur")?.value||0}px) hue-rotate(${hue}deg) sepia(${sep}%) ${$("filter")?.value==="none"?"":$("filter")?.value||""}`;
}
function applySharpen(base){
  const s=Number($("sharpen")?.value)||0;if(s<=0)return base;
  const w=base.width,h=base.height,c2=document.createElement("canvas");c2.width=w;c2.height=h;
  const x2=c2.getContext("2d");x2.drawImage(base,0,0);
  const src=base.getContext("2d").getImageData(0,0,w,h),dst=x2.getImageData(0,0,w,h);
  const amt=s/12,k=[0,-1,0,-1,5+amt*4,-1,0,-1,0];
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const idx=(y*w+x)*4;
    for(let ch=0;ch<3;ch++){
      let v=0,ki=0;
      for(let ky=-1;ky<=1;ky++)for(let kx=-1;kx<=1;kx++){
        const i2=((y+ky)*w+(x+kx))*4+ch;
        v+=src.data[i2]*k[ki++];
      }
      dst.data[idx+ch]=clamp(v,0,255);
    }
  }
  x2.putImageData(dst,0,0);return c2;
}

/* TEXT */
function fontString(i){return `${i.italic?"italic":"normal"} ${i.bold?"bold":"normal"} ${i.size}px "${i.fontFamily}"`}
function spacedWidth(c,text,sp){let w=0;for(let i=0;i<text.length;i++)w+=c.measureText(text[i]).width;return w+Math.max(0,text.length-1)*sp}
const getTextLines=i=>String(i.text||"").split("\n");
function getTextMetrics(item){
  ctx.save();ctx.font=fontString(item);
  const lines=getTextLines(item),spacing=Number(item.letterSpacing)||0;
  const widths=lines.map(l=>spacedWidth(ctx,l,spacing)),width=Math.max(1,...widths);
  const lineHeight=item.size*(Number(item.lineSpacing)||1.2),height=Math.max(item.size,lines.length*lineHeight);
  const padding=item.backgroundEnabled?12:10,align=item.align||"center";
  const left=align==="center"?-width/2:align==="right"?-width:0;
  const curve=item.curve||"none",curveExtra=curve==="none"?0:Math.max(item.size,Number(item.curveAmount)||180);
  const totalWidth=curve==="circle"?Math.max(width,curveExtra*1.2):width;
  ctx.restore();
  return{x:left-padding,y:-height/2-padding,width:totalWidth+padding*2,height:height+curveExtra/2+padding*2,padding,lines,lineHeight};
}
function getTextBounds(item){
  const m=getTextMetrics(item),r=(Number(item.rotation)||0)*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  const pts=[{x:m.x,y:m.y},{x:m.x+m.width,y:m.y},{x:m.x+m.width,y:m.y+m.height},{x:m.x,y:m.y+m.height}].map(p=>({x:item.x+p.x*c-p.y*s,y:item.y+p.x*s+p.y*c}));
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  return{x:Math.min(...xs),y:Math.min(...ys),width:Math.max(...xs)-Math.min(...xs),height:Math.max(...ys)-Math.min(...ys)};
}
function drawCurvedLine(c,item,line,stroke){
  const chars=[...line];if(!chars.length)return;
  const spacing=Number(item.letterSpacing)||0,widths=chars.map(ch=>c.measureText(ch).width+spacing);
  const total=widths.reduce((a,b)=>a+b,0)-spacing,amount=clamp(Number(item.curveAmount)||180,45,360);
  const radius=Math.max(item.size*1.5,total/(amount*Math.PI/180)),dir=item.curve==="down"?-1:1;
  let cur=item.curve==="circle"?-Math.PI:-total/(2*radius);
  for(let i=0;i<chars.length;i++){
    const w=widths[i]-spacing,mid=cur+w/(2*radius);
    c.save();
    if(item.curve==="circle"){c.rotate(mid+Math.PI/2);c.translate(0,-radius);c.rotate(Math.PI)}
    else{c.translate(Math.sin(mid)*radius,dir*(radius-Math.cos(mid)*radius));c.rotate(-dir*mid)}
    stroke?c.strokeText(chars[i],0,0):c.fillText(chars[i],0,0);
    c.restore();cur+=widths[i]/radius;
  }
}
function drawTextContent(c,item,stroke){
  const lines=getTextLines(item);
  c.font=fontString(item);c.textAlign=item.align||"center";c.textBaseline="middle";c.lineJoin="round";
  const spacing=Number(item.letterSpacing)||0,lh=item.size*(Number(item.lineSpacing)||1.2);
  if((item.curve||"none")!=="none"&&lines.length===1){drawCurvedLine(c,item,lines[0],stroke);return}
  const startY=-(lines.length-1)*lh/2;
  lines.forEach((line,i)=>{
    const y=startY+i*lh;
    if(spacing){
      const width=spacedWidth(c,line,spacing);let cur=0;
      if((item.align||"center")==="center")cur-=width/2;if(item.align==="right")cur-=width;
      for(const ch of line){stroke?c.strokeText(ch,cur,y):c.fillText(ch,cur,y);cur+=c.measureText(ch).width+spacing}
    }else stroke?c.strokeText(line,0,y):c.fillText(line,0,y);
  });
}

const FRAMES=[

function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function star8(c,x,y,r){c.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8-Math.PI/2,rad=i%2?r*.55:r;c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}c.closePath();c.fill()}
function drawFrame(c,W,H,f){

      for(let y=o+s;y<H-o;y+=s){c.beginPath();c.arc(o,y,r,0,7);c.fill();c.beginPath();c.arc(W-o,y,r,0,7);c.fill()}break}
    case"inset":{const d=t*2,a=.85,mk=(x0,y0,x1,y1,rx,ry,rw,rh)=>{const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,hexA(f.color,a));g.addColorStop(1,hexA(f.color,0));c.fillStyle=g;c.fillRect(rx,ry,rw,rh)};
      mk(0,0,0,d,0,0,W,d);mk(0,H,0,H-d,0,H-d,W,d);mk(0,0,d,0,0,0,d,H);mk(W,0,W-d,0,W-d,0,d,H);break}

/* PIXABAY FRAME SEARCH */
let pixaRes=[];
async function searchFramesPixabay(){
  const q=$("frameSearch").value.trim();if(!q){toast("Type a word");return}
  const box=$("frameResults");box.innerHTML='<div class="note">Searching worldwide frames...</div>';
  try{
    const url=`https://pixabay.com/api/?key=${PIXABAY_KEY}&q=${encodeURIComponent(q+" frame")}&image_type=photo&per_page=30&safesearch=true`;
    const r=await fetch(url);
    if(!r.ok)throw new Error("pixabay "+r.status);
    const d=await r.json();
    pixaRes=(d.hits||[]).filter(h=>h.webformatURL);
    if(!pixaRes.length){box.innerHTML='<div class="note">Nothing found. Try another word.</div>';return}
    box.innerHTML=pixaRes.map((h,i)=>`<div class="online-card"><img src="${h.previewURL}" loading="lazy" alt=""><div class="t">${esc(h.tags||"Frame")}</div><div class="m">${h.imageWidth}×${h.imageHeight} · Pixabay</div><div class="g2"><button class="sec" type="button" data-i="${i}" data-m="frame">Frame</button><button class="sec" type="button" data-i="${i}" data-m="sticker">Sticker</button></div></div>`).join("");
  }catch(e){box.innerHTML='<div class="note">Error: '+esc(e.message)+'</div>'}
}
function addFrameFromPixabay(i,mode){
  const h=pixaRes[i];if(!h)return;
  if(!img){toast("Upload a photo first.");return}
  const url=h.largeImageURL||h.webformatURL;
  if(mode==="frame"){
    saveSnapshot();
    frameOnline={url,x:50,y:50,size:0,w:0,h:0,opacity:100,rotation:0};
    loadFrameImage();
  }else{
    const d=getBaseDimensions();
    addOverlay({type:"image",src:url,size:Math.round(Math.min(d.width,d.height)*.6),x:50,y:50});
  }
}
function loadFrameImage(){
  if(!frameOnline||!frameOnline.url)return;
  const im=new Image();
  im.crossOrigin="anonymous";
  im.onload=()=>{
    frameOnline.img=im;
    frameOnline.w=im.width;frameOnline.h=im.height;
    if(!frameOnline.size)frameOnline.size=Math.min(getBaseDimensions().width,getBaseDimensions().height);
    overlays=overlays.filter(o=>o.type!=="onlineFrame");
    overlays.push({type:"onlineFrame",src:frameOnline.url,img:im,size:frameOnline.size,x:frameOnline.x,y:frameOnline.y,opacity:frameOnline.opacity,rotation:frameOnline.rotation});
    selectedIndex=overlays.length-1;
    render();
    toast("Frame added! Drag to move, pinch to resize.");
  };
  im.onerror=()=>toast("Could not load image");
  im.src=frameOnline.url;
}

/* RENDER */
function drawOverlays(c){
  overlays.forEach(item=>{
    c.save();
    if(item.type==="text"){
      c.globalAlpha=clamp(item.opacity===undefined?100:Number(item.opacity),0,100)/100;
      c.translate(item.x,item.y);c.rotate((Number(item.rotation)||0)*Math.PI/180);
      const m=getTextMetrics(item);
      if(item.backgroundEnabled){c.fillStyle=item.backgroundColor||"#000000";c.fillRect(m.x,m.y,m.width,m.height)}
      if(item.shadowEnabled){
        c.shadowColor=item.shadowColor||"#000000";c.shadowBlur=Number(item.shadowBlur)||0;
        c.shadowOffsetX=Number(item.shadowOffsetX)||0;c.shadowOffsetY=Number(item.shadowOffsetY)||0;
        c.fillStyle=item.color;drawTextContent(c,item,false);
        c.shadowColor="transparent";c.shadowBlur=0;c.shadowOffsetX=0;c.shadowOffsetY=0;
      }
      if(Number(item.outlineWidth)>0){c.strokeStyle=item.outlineColor||"#000000";c.lineWidth=Number(item.outlineWidth);drawTextContent(c,item,true)}
      c.fillStyle=item.color||"#ffffff";drawTextContent(c,item,false);

  saveSnapshot();
  const base=makeBaseCanvas(),s=Math.min(1,200/Math.max(base.width,base.height));

function sampleColor(clientX,clientY){

function startCrop(){

let cropDragMode=null,cropStart=null;
function cropHitTest(x,y){
  if(!cropRect)return null;

  if(Math.abs(x-s.sx-s.sw)<hs&&Math.abs(y-s.sy)<hs)return"tr";
  if(Math.abs(x-s.sx)<hs&&Math.abs(y-s.sy-s.sh)<hs)return"bl";
  if(Math.abs(x-s.sx-s.sw)<hs&&Math.abs(y-s.sy-s.sh)<hs)return"br";

  if(mode==="move"){s.sx=clamp(s.sx+dx,0,img.width-s.sw);s.sy=clamp(s.sy+dy,0,img.height-s.sh);return}
  let x1=s.sx,y1=s.sy,x2=s.sx+s.sw,y2=s.sy+s.sh;
  if(mode.includes("l"))x1=clamp(x+dx,0,x2-min);
  if(mode.includes("r"))x2=clamp(x+dx,x1+min,img.width);
  if(mode.includes("t"))y1=clamp(y+dy,0,y2-min);
  if(mode.includes("b"))y2=clamp(y+dy,y1+min,img.height);

/* POINTER */
function getPointerPosition(e){const r=canvas.getBoundingClientRect(),base=getBaseDimensions();return{x:(e.clientX-r.left)*base.width/r.width,y:(e.clientY-r.top)*base.height/r.height}}

  if(item.type==="text"){
    const r=(Number(item.rotation)||0)*Math.PI/180,dx=x-item.x,dy=y-item.y;
    const lx=dx*Math.cos(r)+dy*Math.sin(r),ly=-dx*Math.sin(r)+dy*Math.cos(r),b=getTextMetrics(item);
    const pad=16;
    return lx>=b.x-pad&&lx<=b.x+b.width+pad&&ly>=b.y-pad&&ly<=b.y+b.height+pad;

  }

    return;
  }

  }

  const p=getPointerPosition(event),item=overlays[draggingIndex];

});

/* DOWNLOAD */
function download(){
  if(!img){toast("Upload a photo first.");return}
  const format=$("format").value,ext=format==="image/jpeg"?"jpg":format==="image/webp"?"webp":"png";
  const name=($("fileName").value||"pikora-edited-photo").replace(/[\\/:*?"<>|]/g,"_");
  try{
    const c=flatten(1e9);
    c.toBlob(blob=>{
      if(!blob){toast("Export failed");return}
      const url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download=`${name}.${ext}`;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Photo downloaded!");
    },format,0.95);
  }catch(e){toast("Export failed")}
}
function resetAll(){
  if(!img){toast("Upload photo first");return}
  saveSnapshot();
  angle=0;straighten=0;flipH=false;flipV=false;overlays=[];selectedIndex=-1;outputWidth=0;outputHeight=0;frame={...DEF_FRAME};frameOnline=null;cropRect=null;
  updateRangeLabels();render();setStatus("Reset.");
}

function selectPlatform(key){

function applyPlatform(){
  if(!img){toast("Upload photo first");return}
  if(!platform){toast("Pick a platform");return}
  saveSnapshot();
  outputWidth=platform.w;outputHeight=platform.h;
  let found="original";
  if(platform.key==="ig-post")found="1:1";
  else if(["yt-shorts","ig-story","tiktok"].includes(platform.key))found="9:16";
  else if(platform.key==="pinterest")found="3:4";
  else if(["yt-thumb","fb-post","x-post","linkedin"].includes(platform.key))found="16:9";
  $("crop").value=found;

/* AI */
let originalImageCanvas=null;
function chromaRemove(canvasEl,targetColor,tolerance,softness){
  const c=canvasEl.getContext("2d");
  const imgData=c.getImageData(0,0,canvasEl.width,canvasEl.height);
  const d=imgData.data;const tn=parseInt(targetColor.slice(1),16);
  const tr=(tn>>16)&255,tg=(tn>>8)&255,tb=tn&255;
  const tol=tolerance*3,soft=softness*3;
  for(let i=0;i<d.length;i+=4){
    const dr=d[i]-tr,dg=d[i+1]-tg,db=d[i+2]-tb;
    const dist=Math.sqrt(dr*dr+dg*dg+db*db);
    if(dist<tol)d[i+3]=0;
    else if(dist<tol+soft)d[i+3]=Math.round(255*(dist-tol)/soft);
  }
  c.putImageData(imgData,0,0);
}
function chromaApply(){
  if(!img){toast("Upload photo first");return}
  saveSnapshot();
  if(!originalImageCanvas)originalImageCanvas=makeBaseCanvas();
  const tol=+$("chromaTol").value,soft=+$("chromaSoft").value;
  const src=document.createElement("canvas");src.width=originalImageCanvas.width;src.height=originalImageCanvas.height;
  src.getContext("2d").drawImage(originalImageCanvas,0,0);
  chromaRemove(src,$("chromaColor").value,tol,soft);
  const ni=new Image();
  ni.onload=()=>{img=ni;render();toast("Background removed. Save as PNG!")};
  ni.src=src.toDataURL("image/png");
  if($("format"))$("format").value="image/png";
}
function chromaReset(){
  if(!originalImageCanvas){toast("Nothing to restore");return}
  saveSnapshot();
  const ni=new Image();
  ni.onload=()=>{img=ni;originalImageCanvas=null;render();toast("Original restored")};
  ni.src=originalImageCanvas.toDataURL("image/png");
}
function chromaSample(){
  if(!img){toast("Upload photo first");return}
  const base=makeBaseCanvas();
  const t=document.createElement("canvas");t.width=base.width;t.height=base.height;t.getContext("2d").drawImage(base,0,0);
  try{
    const d=t.getContext("2d").getImageData(5,5,1,1).data;
    $("chromaColor").value="#"+d[0].toString(16).padStart(2,"0")+d[1].toString(16).padStart(2,"0")+d[2].toString(16).padStart(2,"0");
    toast("Sampled top-left");
  }catch(e){toast("Failed")}
}
async function faceCrop(){
  if(!img){toast("Upload photo first");return}
  if(!("FaceDetector" in window)){toast("Not supported");return}
  try{
    const base=makeBaseCanvas();
    const tmp=document.createElement("canvas");tmp.width=base.width;tmp.height=base.height;tmp.getContext("2d").drawImage(base,0,0);
    const detector=new FaceDetector({fastMode:false,maxDetectedFaces:5});
    const faces=await detector.detect(tmp);
    if(!faces.length){toast("No faces found");return}
    faces.sort((a,b)=>b.boundingBox.width-a.boundingBox.width);
    const f=faces[0].boundingBox;
    saveSnapshot();
    const pad=Math.max(f.width,f.height)*0.6;
    const cx=f.x+f.width/2,cy=f.y+f.height/2;
    const size=Math.min(base.width,base.height,Math.max(f.width,f.height)+pad*2);
    cropRect={sx:clamp(cx-size/2,0,base.width-size),sy:clamp(cy-size/2,0,base.height-size),sw:size,sh:size};
    render();toast(`Detected ${faces.length} face(s)`);
  }catch(err){toast("Failed: "+err.message)}
}
function faceCropReset(){if(!cropRect){toast("Nothing to undo");return}saveSnapshot();cropRect=null;render()}

/* PHOTO TO VIDEO */
function thumbOf(c){const t=document.createElement("canvas"),s=Math.min(1,160/Math.max(c.width,c.height));t.width=Math.round(c.width*s);t.height=Math.round(c.height*s);t.getContext("2d").drawImage(c,0,0,t.width,t.height);return t.toDataURL("image/jpeg",.7)}
function planNums(){
  const n=slides.length||(img?1:0);let per=Math.max(.5,parseFloat($("slideSecs")?.value)||3);
  if($("fitMusic")?.checked&&music.dur>0&&n)per=Math.max(.5,music.dur/n);
  return{n,per,total:per*n};
}
function renderStrip(){
  const r=$("slidesRow");if(!r)return;
  r.innerHTML=slides.map((s,i)=>`<div class="slide"><img src="${s.thumb}" alt=""><span class="n">${i+1}</span><div class="sa"><button data-a="l" data-i="${i}">◀</button><button data-a="x" data-i="${i}">✕</button><button data-a="r" data-i="${i}">▶</button></div></div>`).join("")||'<div class="tl-hint">Edit a photo, then tap “＋ Add to video”</div>';
  const p=planNums();
  $("stripInfo").textContent=p.n?`${p.n} photo${p.n>1?"s":""} · ${fmtT(p.total)}`:"No photos yet";
}
document.addEventListener("click",e=>{
  const b=e.target.closest("#slidesRow button[data-a]");if(!b)return;
  const i=+b.dataset.i,a=b.dataset.a;
  if(a==="x")slides.splice(i,1);
  if(a==="l"&&i>0)[slides[i-1],slides[i]]=[slides[i],slides[i-1]];
  if(a==="r"&&i<slides.length-1)[slides[i+1],slides[i]]=[slides[i],slides[i+1]];
  renderStrip();
});
$("addSlideBtn").onclick=()=>{
  if(!img){toast("Upload photo first");return}
  const c=flatten(1280);slides.push({canvas:c,thumb:thumbOf(c)});renderStrip();toast("Photo added.");
};
async function fileToSlide(file){
  const im=await loadImageFile(file),[rw,rh]=ratioWH(),r=$("crop").value==="original"?im.width/im.height:rw/rh;
  let w=1280,h=Math.round(1280/r);if(h>1280){h=1280;w=Math.round(1280*r)}
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;c.getContext("2d").drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);
  slides.push({canvas:c,thumb:thumbOf(c)});
}
async function addManyFiles(files){
  const list=[...files].filter(f=>f.type.startsWith("image/"));if(!list.length)return;
  for(const f of list){try{await fileToSlide(f)}catch(e){}}
  renderStrip();toast(list.length+" photo(s) added.");
}
$("slidesUpload").addEventListener("change",e=>{const f=e.target.files;addManyFiles(f).then(()=>{e.target.value=""})});

/* MUSIC */
let libResults=[],libAudio=new Audio(),libNow=-1;
async function getDeezer(q){
  const r=await fetch("https://api.deezer.com/search?q="+encodeURIComponent(q)+"&limit=25");
  if(!r.ok)throw new Error("deezer "+r.status);
  const d=await r.json();
  return (d.data||[]).map(t=>({src:"deezer",title:t.title||"Untitled",creator:t.artist?.name||"Unknown",duration:(t.duration||30)*1000,preview:t.preview,license:"Deezer 30s"})).filter(t=>t.preview);
}
async function getiTunes(q){
  const r=await fetch("https://itunes.apple.com/search?term="+encodeURIComponent(q)+"&media=music&limit=25");
  if(!r.ok)throw new Error("itunes "+r.status);
  const d=await r.json();
  return (d.results||[]).map(t=>({src:"itunes",title:t.trackName||"Untitled",creator:t.artistName||"Unknown",duration:(t.trackTimeMillis||30000),preview:t.previewUrl,license:"iTunes 30s"})).filter(t=>t.preview);
}
async function searchMusic(){
  const q=($("musicSearch")?.value||"").trim();if(!q){toast("Type a word");return}
  const box=$("musicResults");if(!box)return;
  box.innerHTML='<div class="note">Searching...</div>';stopLib();
  const res=await Promise.allSettled([getDeezer(q),getiTunes(q)]);
  const ok=res.filter(r=>r.status==="fulfilled").map(r=>r.value);
  if(!ok.length){box.innerHTML='<div class="note">Could not load.</div>';return}
  libResults=[];const mx=Math.max(...ok.map(a=>a.length));
  for(let i=0;i<mx;i++)ok.forEach(a=>{if(a[i])libResults.push(a[i])});
  renderLibResults();
}
async function searchTrending(){
  const box=$("musicResults");if(!box)return;
  box.innerHTML='<div class="note">Loading trending...</div>';stopLib();
  const trendingQs=["top hits 2024","bollywood hits","quran recitation","lofi study","tiktok viral"];
  try{libResults=await getDeezer(trendingQs[Math.floor(Math.random()*trendingQs.length)]);renderLibResults()}
  catch(e){box.innerHTML='<div class="note">Could not load.</div>'}
}
function renderLibResults(){
  const box=$("musicResults");if(!box)return;
  box.innerHTML=libResults.map((t,i)=>{
    const sec=Math.round((t.duration||0)/1000),d=sec?" · "+Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"):"";
    return `<div class="list-item"><div class="t">${esc(t.title||"Untitled")}</div><div class="m">${esc(t.creator||"Unknown")}${d} · ${esc(t.license)}</div><div class="g2"><button class="sec lp" type="button" onclick="pkLibPlay(${i})" style="margin-top:0">▶ Preview</button><button class="sec" type="button" onclick="pkLibAdd(${i})" style="margin-top:0">+ Add</button></div></div>`;
  }).join("")||'<div class="note">Nothing found.</div>';
}
function paintLib(){if($("stopLibBtn"))$("stopLibBtn").hidden=libAudio.paused;document.querySelectorAll("#musicResults .lp").forEach((b,i)=>b.textContent=(i===libNow&&!libAudio.paused)?"⏹ Stop":"▶ Preview")}
function stopLib(){libAudio.pause();libNow=-1;paintLib()}
libAudio.addEventListener("ended",stopLib);libAudio.addEventListener("pause",paintLib);
window.pkLibPlay=async i=>{
  const t=libResults[i];if(!t||!t.preview)return;
  if(libNow===i&&!libAudio.paused){stopLib();return}
  libAudio.pause();libNow=i;
  try{libAudio.src=t.preview;await libAudio.play();paintLib()}catch(e){libNow=-1;paintLib();toast("Cannot preview")}
};
window.pkLibAdd=async i=>{
  const t=libResults[i];if(!t||!t.preview)return;stopLib();toast("Adding...");
  const credit=(t.title||"Untitled")+" – "+(t.creator||"Unknown")+" (30s)";
  try{
    const r=await fetch(t.preview);if(!r.ok)throw new Error("blocked");
    setMusicSource(URL.createObjectURL(await r.blob()),credit,true);toast("Music added ✅");
  }catch(err){setMusicSource(t.preview,credit,false);toast("Music added (preview only)")}
};
function setMusicSource(url,name,isBlob){
  if(music.url&&music.blob)URL.revokeObjectURL(music.url);
  music={url,blob:!!isBlob,dur:0,name};
  const a=new Audio();a.preload="metadata";a.src=url;a.onloadedmetadata=()=>{music.dur=isFinite(a.duration)?a.duration:0;renderStrip()};
  if($("musicInfo"))$("musicInfo").textContent="🎵 "+name;
  if($("musicControls"))$("musicControls").hidden=false;
  renderStrip();
}
function removeMusic(){
  if(music.url&&music.blob)URL.revokeObjectURL(music.url);
  music={url:null,blob:false,dur:0,name:""};
  if($("musicInfo"))$("musicInfo").textContent="No music selected.";
  if($("musicControls"))$("musicControls").hidden=true;
  renderStrip();
}

/* PHOTO → VIDEO */
function drawCover(c,cv,w,h,o){
  const s0=Math.max(w/cv.width,h/cv.height)*(o.scale||1),dw=cv.width*s0,dh=cv.height*s0;
  c.save();c.globalAlpha=o.alpha??1;
  if(o.clip!=null&&o.clip<1){c.beginPath();c.rect(0,0,w*o.clip,h);c.clip()}
  c.drawImage(cv,(w-dw)/2+(o.dx||0),(h-dh)/2,dw,dh);c.restore();
}
function drawShow(c,w,h,t,fr,per,o){
  const n=fr.length,i=Math.min(n-1,Math.floor(t/per)),local=Math.min(per,t-i*per);
  const td=o.trans==="none"||i===0?0:Math.min(.7,per/2),p=td?clamp(local/td,0,1):1;
  const kb=lt=>o.kb?1+.08*(lt/per):1;
  c.fillStyle="#000";c.fillRect(0,0,w,h);
  if(td&&p<1){
    drawCover(c,fr[i-1],w,h,{scale:kb(per)});
    if(o.trans==="fade")drawCover(c,fr[i],w,h,{scale:kb(local),alpha:p});
    else if(o.trans==="slide")drawCover(c,fr[i],w,h,{scale:kb(local),dx:(1-p)*w});
    else if(o.trans==="zoom")drawCover(c,fr[i],w,h,{scale:kb(local)*(1.25-.25*p),alpha:p});
    else drawCover(c,fr[i],w,h,{scale:kb(local),clip:p});
  }else drawCover(c,fr[i],w,h,{scale:kb(local)});
}
function showSize(fr){
  const r=$("crop").value;
  if(r==="9:16")return[720,1280];if(r==="16:9")return[1280,720];if(r==="1:1")return[1080,1080];if(r==="4:5")return[864,1080];
  const f=fr[0],s=Math.min(1,1280/Math.max(f.width,f.height));return[Math.round(f.width*s/2)*2,Math.round(f.height*s/2)*2];
}
let running=false,stopFlag=false;
async function runShow(record){
  if(running)return;
  const fr=slides.length?slides.map(s=>s.canvas):(img?[flatten(1280)]:[]);
  if(!fr.length){toast("Upload a photo first");return}
  const p=planNums(),per=p.per,total=p.total,[w,h]=showSize(fr);
  running=true;stopFlag=false;
  const o={trans:$("slideTrans")?.value||"fade",kb:$("kenBurns")?.checked!==false};
  const vol=+($("musicVol")?.value||0.8),fi=1,fo=Math.min(+($("fadeOut")?.value||0),total/2);
  let cv,c,musicEl=null,actx=null,rec=null,stream=null,gain=null,done=null;const chunks=[];
  if(record){cv=document.createElement("canvas");$("showDownload").hidden=true}
  else{cv=$("showCanvas");canvas.hidden=true;placeholder.hidden=true;cv.hidden=false}
  cv.width=w;cv.height=h;c=cv.getContext("2d");if(!record)fitEl(cv,w,h);
  $("stopShowBtn").hidden=false;$("exportShowBtn").disabled=true;$("previewShowBtn").disabled=true;
  try{
    if(music.url){musicEl=new Audio(music.url);musicEl.loop=true}
    if(record){
      if(!window.MediaRecorder)throw new Error("Cannot record");
      stream=cv.captureStream(30);
      if(musicEl){
        const AC=window.AudioContext||window.webkitAudioContext;actx=new AC();
        const src=actx.createMediaElementSource(musicEl);gain=actx.createGain();gain.gain.value=0;
        const dest=actx.createMediaStreamDestination();src.connect(gain);gain.connect(dest);
        dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));await actx.resume();
      }
      const mime=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(t=>MediaRecorder.isTypeSupported(t));
      if(!mime)throw new Error("WebM not supported");
      rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5e6});
      rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};done=new Promise(r=>rec.onstop=r);
    }
    drawShow(c,w,h,0,fr,per,o);
    if(record)rec.start(250);
    if(musicEl){
      if(gain){const n=actx.currentTime;gain.gain.setValueAtTime(0,n);gain.gain.linearRampToValueAtTime(vol,n+fi);
        if(fo>0){gain.gain.setValueAtTime(vol,Math.max(n+fi,n+total-fo));gain.gain.linearRampToValueAtTime(0,n+total)}}
      await musicEl.play().catch(()=>{});
    }
    const t0=performance.now();
    await new Promise(res=>{const id=setInterval(()=>{
      const t=(performance.now()-t0)/1000;
      if(stopFlag||t>=total){clearInterval(id);res();return}
      drawShow(c,w,h,t,fr,per,o);
      $("stripInfo").textContent=(record?"Making ":"Preview ")+Math.round(t/total*100)+"%";
    },33)});
    if(record){
      if(!stopFlag){drawShow(c,w,h,total-.01,fr,per,o);await sleep(200)}
      rec.stop();await done;
      if(!stopFlag){
        const blob=new Blob(chunks,{type:"video/webm"}),a=$("showDownload");
        if(a.dataset.u)URL.revokeObjectURL(a.dataset.u);a.dataset.u=URL.createObjectURL(blob);a.href=a.dataset.u;
        a.textContent="⬇ Download ("+(blob.size/1048576).toFixed(1)+" MB)";a.hidden=false;toast("Video ready!");
      }
    }
  }catch(err){toast("Error: "+err.message);if(rec&&rec.state!=="inactive"){try{rec.stop()}catch(e){}}}
  finally{
    if(musicEl)musicEl.pause();if(actx)actx.close().catch(()=>{});if(stream)stream.getTracks().forEach(t=>t.stop());
    $("showCanvas").hidden=true;if(img){canvas.hidden=false;fitCanvas()}else placeholder.hidden=false;
    running=false;$("stopShowBtn").hidden=true;$("exportShowBtn").disabled=false;$("previewShowBtn").disabled=false;renderStrip();
  }
}
$("previewShowBtn").onclick=()=>runShow(false);
$("exportShowBtn").onclick=()=>{
  const p=planNums();
  if(p.total>60&&isMobile()){if(!confirm("Long video may crash phones. Continue?"))return}
  runShow(true);
};
$("stopShowBtn").onclick=()=>{stopFlag=true};

/* DRAG/DROP */
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files")){e.preventDefault();document.body.classList.add("dragging")}}));
document.addEventListener("dragleave",e=>{if(!e.relatedTarget)document.body.classList.remove("dragging")});
document.addEventListener("drop",e=>{
  if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();document.body.classList.remove("dragging");
  const files=[...e.dataTransfer.files],imgs=files.filter(f=>f.type.startsWith("image/")),aud=files.find(f=>f.type.startsWith("audio/"));
  if(aud&&!imgs.length){setMusicSource(URL.createObjectURL(aud),aud.name,true);toast("Music added");return}
  if(!imgs.length){toast("Drop a photo");return}
  openPhoto(imgs[0]);if(imgs.length>1)addManyFiles(imgs.slice(1));
});

/* KEYS */
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();e.shiftKey?redo():undo()}
  else if((e.ctrlKey||e.metaKey)&&k==="y"){e.preventDefault();redo()}
  else if((k==="delete"||k==="backspace")&&selectedIndex>=0){e.preventDefault();deleteSelected()}
  else if(k==="escape"){pickTarget=null;$("eyedropperBanner").classList.remove("show");if(cropActive)$("cropCancel").click();document.querySelectorAll(".pick").forEach(b=>b.classList.remove("active"))}
});

fitCanvas();renderStrip();
})();
