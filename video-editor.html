async function exportMP4(){
  const muxerMod=await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm");
  const {Muxer,ArrayBufferTarget}=muxerMod;
  const[w,h]=getExportSize();const FPS=30;const total=totalDuration();const totalFrames=Math.ceil(total*FPS);
  const target=new ArrayBufferTarget();
  const bitrate=Math.round((+$("exportQuality").value||5)*1e6);
  const btnPrep=$("startExportBtn");btnPrep.textContent="Mixing audio…";
  const audioMix=await buildMixedAudio(total);
  const wantsSound=clips.some(c=>!c.muted)||(musicClips.length&&!musicMuted)||(voiceoverURL&&!voiceMuted)||sfx.length>0;
  const hasAudio=!!(audioMix&&audioMix.left.length>0&&audioMix.peak>0);
  if(wantsSound&&!hasAudio){showToast("No sound found","The browser could not read the audio from your clips. Try an MP4 (H.264 + AAC) file.")}
  // AAC encoding is missing in Firefox, Chrome on Linux and some Android phones; fall back to Opus so the video keeps its sound.
  let audioCodec=null;
  if(hasAudio&&typeof AudioEncoder!=="undefined"){
    const cfg=codec=>({codec,sampleRate:48000,numberOfChannels:2,bitrate:128000});
    try{if((await AudioEncoder.isConfigSupported(cfg("mp4a.40.2"))).supported)audioCodec={muxer:"aac",enc:"mp4a.40.2"}}catch(e){}
    if(!audioCodec){try{if((await AudioEncoder.isConfigSupported(cfg("opus"))).supported)audioCodec={muxer:"opus",enc:"opus"}}catch(e){}}
  }
  if(hasAudio&&!audioCodec){return exportWebM()}
  const muxer=new Muxer({target,video:{codec:"avc",width:w,height:h,frameRate:FPS},...(audioCodec?{audio:{codec:audioCodec.muxer,numberOfChannels:2,sampleRate:48000}}:{}),fastStart:"in-memory",firstTimestampBehavior:"offset"});
  let videoEncoder;
  try{
    await VideoEncoder.isConfigSupported({codec:"avc1.42001f",width:w,height:h,bitrate,framerate:FPS});
    videoEncoder=new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),error:e=>console.error("video enc",e)});
    videoEncoder.configure({codec:"avc1.42001f",width:w,height:h,bitrate,framerate:FPS,latencyMode:"quality"});
  }catch(e){throw new Error("VideoEncoder unavailable: "+e.message)}
  let audioEncoder=null,audioEncError=null;
  if(audioCodec){
    audioEncoder=new AudioEncoder({output:(chunk,meta)=>muxer.addAudioChunk(chunk,meta),error:e=>{audioEncError=e;console.error("audio enc",e)}});
    audioEncoder.configure({codec:audioCodec.enc,sampleRate:48000,numberOfChannels:2,bitrate:128000});
  }
  const canvas=new OffscreenCanvas(w,h);const ctx=canvas.getContext("2d",{alpha:false});
  const fit=$("fitMode").value;const timeline=[];let acc=0;
  for(const c of clips){const d=durationOf(c);timeline.push({clip:c,start:acc,end:acc+d});acc+=d}
  const videoEls=await Promise.all(clips.map(c=>new Promise(res=>{
    const v=document.createElement("video");v.src=c.url;v.muted=true;v.playsInline=true;v.preload="auto";v.onloadedmetadata=()=>res(v);v.onerror=()=>res(v);v.load();
  })));
  const btn=$("startExportBtn");
  for(let f=0;f<totalFrames;f++){
    const gt=f/FPS;let ci=timeline.findIndex(t=>gt>=t.start&&gt<t.end);if(ci<0)ci=timeline.length-1;
    const tinfo=timeline[ci];const c=tinfo.clip;const local=gt-tinfo.start;const videoT=c.start+local*c.speed;const v=videoEls[ci];
    if(Math.abs(v.currentTime-videoT)>0.1){await new Promise(res=>{v.onseeked=()=>{v.onseeked=null;res()};v.currentTime=Math.min(videoT,v.duration-0.05)})}
    const es=effectState(c,local,durationOf(c));
    ctx.fillStyle="#000";ctx.fillRect(0,0,w,h);
    ctx.save();ctx.translate(w/2+es.dx*(w/720),h/2+es.dy*(h/720));ctx.rotate((es.rot||0)*Math.PI/180);ctx.scale(es.scale,es.scale);ctx.translate(-w/2,-h/2);
    let filterStr=(c.filter==="none"?"":c.filter+" ")+"brightness("+c.brightness+"%) contrast("+c.contrast+"%) saturate("+c.saturation+"%)";
    if(es.blur>0)filterStr+=" blur("+es.blur+"px)";
    drawVideo(ctx,v,w,h,fit,filterStr,1,c.transition,local/Math.max(0.001,c.transitionDuration||1));
    ctx.restore();
    if(es.flash>0){ctx.fillStyle=`rgba(255,255,255,${es.flash})`;ctx.fillRect(0,0,w,h)}
    stickers.forEach(s=>drawSticker(ctx,s,w,h,gt));
    texts.forEach(t=>drawText(ctx,t,gt,w,h));
    drawCaption(ctx,gt,w,h);
    const bitmap=canvas.transferToImageBitmap();
    const frame=new VideoFrame(bitmap,{timestamp:Math.round(gt*1e6),duration:Math.round((1/FPS)*1e6)});
    videoEncoder.encode(frame,{keyFrame:f%60===0});
    frame.close();bitmap.close();
    if(f%5===0)btn.textContent=`Rendering ${Math.round(f/totalFrames*100)}%`;
    if(f%30===0)await new Promise(r=>setTimeout(r,0));
  }
  await videoEncoder.flush();videoEncoder.close();
  if(audioEncoder&&audioMix&&audioMix.left.length>0){
    const sampleRate=48000,ch=2;const left=audioMix.left,right=audioMix.right;const FRAME_SAMPLES=1024;
    const len=Math.min(left.length,right.length,Math.floor(total*sampleRate));
    for(let i=0;i<len;i+=FRAME_SAMPLES){
      const n=Math.min(FRAME_SAMPLES,len-i);const interleaved=new Float32Array(n*ch);
      for(let j=0;j<n;j++){interleaved[j*2]=left[i+j];interleaved[j*2+1]=right[i+j]}
      const audioData=new AudioData({format:"f32",sampleRate,numberOfFrames:n,numberOfChannels:ch,timestamp:Math.round(i/sampleRate*1e6),data:interleaved});
      audioEncoder.encode(audioData);audioData.close();
      if(i%(FRAME_SAMPLES*50)===0)await new Promise(r=>setTimeout(r,0));
    }
    await audioEncoder.flush();audioEncoder.close();
    if(audioEncError)showToast("Audio problem","Sound could not be encoded: "+(audioEncError.message||audioEncError));
  }
  muxer.finalize();
  const blob=new Blob([target.buffer],{type:"video/mp4"});
  finishExport(blob,"mp4");
}

async function buildMixedAudio(total){
  try{
    const sampleRate=48000;const totalSamples=Math.ceil(total*sampleRate);
    if(totalSamples<=0)return null;
    const left=new Float32Array(totalSamples),right=new Float32Array(totalSamples);
    const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC({sampleRate});
    let acc=0;const vVol=AS.videoVolume;
    for(const c of clips){
      const dur=durationOf(c);
      if(!c.muted){
        const buf=await fetch(c.url).then(r=>r.arrayBuffer()).then(b=>ac.decodeAudioData(b)).catch(()=>null);
        if(buf){
          const startSample=Math.floor(acc*sampleRate);const len=Math.floor(dur*sampleRate);
          const L=buf.getChannelData(0);const R=buf.numberOfChannels>1?buf.getChannelData(1):L;
          const srcOffsetStart=Math.floor(c.start*buf.sampleRate);const step=buf.sampleRate/sampleRate*c.speed;
          for(let i=0;i<len;i++){const srcI=srcOffsetStart+Math.floor(i*step);if(srcI>=0&&srcI<L.length){left[startSample+i]+=L[srcI]*vVol;right[startSample+i]+=R[srcI]*vVol}}
        }
      }
      acc+=dur;
    }
    if(musicClips.length&&!musicMuted){
      for(const mc of musicClips){
        const buf=await fetch(mc.url).then(r=>r.arrayBuffer()).then(b=>ac.decodeAudioData(b)).catch(()=>null);
        if(!buf)continue;
        const srcL=buf.getChannelData(0);const srcR=buf.numberOfChannels>1?buf.getChannelData(1):srcL;
        const step=buf.sampleRate/sampleRate;const durSrc=(mc.srcEnd-mc.srcStart);
        const startSample=Math.floor(mc.timelineStart*sampleRate);const len=Math.floor(durSrc*sampleRate);
        const srcOffsetStart=Math.floor(mc.srcStart*buf.sampleRate);
        for(let i=0;i<len;i++){
          const srcI=srcOffsetStart+Math.floor(i*step);if(srcI<0||srcI>=srcL.length)continue;
          const idx=startSample+i;if(idx<0||idx>=totalSamples)continue;
          const mt=(i)/sampleRate;
          const fadeInGain=mc.fadeIn>0?Math.min(1,mt/mc.fadeIn):1;
          const fadeOutGain=mc.fadeOut>0?Math.min(1,(durSrc-mt)/mc.fadeOut):1;
          const g=mc.volume*Math.min(fadeInGain,fadeOutGain);
          left[idx]+=srcL[srcI]*g;right[idx]+=srcR[srcI]*g;
        }
      }
    }
    if(voiceoverURL&&!voiceMuted){
      const buf=await fetch(voiceoverURL).then(r=>r.arrayBuffer()).then(b=>ac.decodeAudioData(b)).catch(()=>null);
      if(buf){
        const voStart=AS.voiceStart,voVol=AS.voiceVolume;
        const startSample=Math.floor(voStart*sampleRate);
        const srcL=buf.getChannelData(0);const srcR=buf.numberOfChannels>1?buf.getChannelData(1):srcL;
        const step=buf.sampleRate/sampleRate;
        const len=Math.min(Math.floor(srcL.length/step),totalSamples-startSample);
        for(let i=0;i<len;i++){const srcI=Math.floor(i*step);if(srcI>=srcL.length)break;const idx=startSample+i;left[idx]+=srcL[srcI]*voVol;right[idx]+=srcR[srcI]*voVol}
      }
    }
    for(const s of sfx){
      const buf=await fetch(s.url).then(r=>r.arrayBuffer()).then(b=>ac.decodeAudioData(b)).catch(()=>null);
      if(!buf)continue;
      const startSample=Math.floor(s.start*sampleRate);if(startSample>=totalSamples)continue;
      const srcL=buf.getChannelData(0),srcR=buf.numberOfChannels>1?buf.getChannelData(1):srcL;
      const step=buf.sampleRate/sampleRate,vol=s.volume??1;
      const len=Math.min(Math.floor(srcL.length/step),totalSamples-startSample);
      for(let i=0;i<len;i++){const srcI=Math.floor(i*step);left[startSample+i]+=srcL[srcI]*vol;right[startSample+i]+=srcR[srcI]*vol}
    }
    await ac.close();
    let peak=0;
    for(let i=0;i<totalSamples;i++){left[i]=clamp(left[i],-1,1);right[i]=clamp(right[i],-1,1);peak=Math.max(peak,Math.abs(left[i]),Math.abs(right[i]))}
    return {left,right,peak};
  }catch(e){console.warn("mix audio failed",e);return null}
}

async function exportWebM(){
  if(!window.MediaRecorder){showToast("Unsupported","Use Chrome/Firefox.");return}
  const[w,h]=getExportSize();
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d",{alpha:false});const stream=canvas.captureStream(30);
  const workCanvas=document.createElement("canvas");workCanvas.width=w;workCanvas.height=h;
  const workCtx=workCanvas.getContext("2d",{alpha:false});
  let audioCtx=null,dest=null,musicEls=[],voiceEl=null;const audioEls=[],sfxEls2=[];
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      audioCtx=new AC();dest=audioCtx.createMediaStreamDestination();
      for(const c of clips){
        const el=document.createElement("video");el.src=c.url;el.playsInline=true;
        await new Promise((res,rej)=>{el.onloadedmetadata=res;el.onerror=rej;el.load()});
        const src=audioCtx.createMediaElementSource(el),g=audioCtx.createGain();g.gain.value=c.muted?0:AS.videoVolume;
        src.connect(g);g.connect(dest);audioEls.push({el,gain:g,c});
      }
      if(musicClips.length&&!musicMuted){
        for(const mc of musicClips){
          const m=new Audio(mc.url);
          await new Promise(res=>{m.onloadedmetadata=res;m.onerror=res;m.load()});
          const ms=audioCtx.createMediaElementSource(m),mg=audioCtx.createGain();mg.gain.value=0;
          ms.connect(mg);mg.connect(dest);musicEls.push({el:m,gain:mg,clip:mc});
        }
      }
      if(voiceoverURL&&!voiceMuted){
        voiceEl=new Audio(voiceoverURL);
        await new Promise(res=>{voiceEl.onloadedmetadata=res;voiceEl.onerror=res;voiceEl.load()});
        const vs=audioCtx.createMediaElementSource(voiceEl),vg=audioCtx.createGain();vg.gain.value=AS.voiceVolume;
        vs.connect(vg);vg.connect(dest);voiceEl._gain=vg;
      }
      for(const s of sfx){const el=new Audio(s.url);await new Promise(res=>{el.onloadedmetadata=res;el.onerror=res;el.load()});
        const ss=audioCtx.createMediaElementSource(el),sg=audioCtx.createGain();sg.gain.value=s.volume??1;ss.connect(sg);sg.connect(dest);sfxEls2.push({el,s,done:false})}
      dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
    }
  }catch(err){console.warn("audio init",err)}
  const mime=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime){showToast("Error","WebM unsupported.");cleanup();return}
  let rec;try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:+$("exportQuality").value*1e6})}catch(e){showToast("Error",e.message);cleanup();return}
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const done=new Promise(r=>rec.onstop=r);
  const total=totalDuration();let elapsed=0;const btn=$("startExportBtn");
  try{
    if(audioCtx&&audioCtx.state==="suspended")await audioCtx.resume();
    rec.start(250);
    if(voiceEl){voiceEl.currentTime=Math.max(0,elapsed-AS.voiceStart);if(elapsed>=AS.voiceStart)voiceEl.play().catch(()=>{})}
    for(let i=0;i<clips.length;i++){
      const c=clips[i];const v=audioEls[i]?.el||document.createElement("video");
      if(!audioEls[i]){v.src=c.url;v.muted=true;await new Promise(res=>{v.onloadedmetadata=res;v.load()})}
      v.muted=!audioEls[i]||c.muted;v.volume=1;v.playbackRate=c.speed;v.currentTime=c.start;
      await new Promise(res=>{if(v.readyState>=2)res();else{v.onseeked=res;v.onerror=res}});
      await v.play().catch(()=>{});
      const clipDur=durationOf(c),trans=c.transition,transDur=trans==="cut"?0:Math.min(c.transitionDuration,clipDur/2);
      const clipStart=clips.slice(0,i).reduce((s,x)=>s+durationOf(x),0);
      let lastT=-1,lastMove=performance.now();
      while(v.currentTime<c.end-.025&&!v.ended){
        if(v.currentTime!==lastT){lastT=v.currentTime;lastMove=performance.now()}
        else if(performance.now()-lastMove>4000)break;
        const local=(v.currentTime-c.start)/c.speed,progress=transDur?Math.min(1,local/transDur):1;
        let alpha=1;if(transDur&&local<transDur&&trans==="fade")alpha=progress;
        if(audioEls[i])audioEls[i].gain.gain.value=c.muted?0:AS.videoVolume;
        for(const m of musicEls){
          const mc=m.clip;const gt=clipStart+local;
          const inRange=gt>=mc.timelineStart&&gt<=mc.timelineStart+(mc.srcEnd-mc.srcStart);
          if(!inRange){if(!m.el.paused)m.el.pause();m.gain.gain.value=0;continue}
          const target=mc.srcStart+(gt-mc.timelineStart);
          if(m.el.paused)await m.el.play().catch(()=>{});
          if(Math.abs(m.el.currentTime-target)>0.3)m.el.currentTime=target;
          const mt=gt-mc.timelineStart,durSrc=mc.srcEnd-mc.srcStart;
          const fi=mc.fadeIn>0?Math.min(1,mt/mc.fadeIn):1;
          const fo=mc.fadeOut>0?Math.min(1,(durSrc-mt)/mc.fadeOut):1;
          m.gain.gain.value=mc.volume*Math.min(fi,fo);
        }
        if(voiceEl&&voiceEl._gain){
          const vt=clipStart+local-AS.voiceStart;
          if(vt<0){if(!voiceEl.paused)voiceEl.pause();voiceEl._gain.gain.value=0}
          else{if(voiceEl.paused)await voiceEl.play().catch(()=>{});if(Math.abs(voiceEl.currentTime-vt)>0.3)voiceEl.currentTime=vt;voiceEl._gain.gain.value=AS.voiceVolume}
        }
        sfxEls2.forEach(x=>{const st=clipStart+local-x.s.start;if(!x.done&&st>=0){x.done=true;x.el.currentTime=Math.min(st,Math.max(0,(x.el.duration||1)-.05));x.el.play().catch(()=>{})}});
        const es=effectState(c,local,durationOf(c));
        workCtx.fillStyle="#000";workCtx.fillRect(0,0,w,h);
        workCtx.save();
        workCtx.translate(w/2+es.dx*(w/720),h/2+es.dy*(h/720));
        workCtx.rotate((es.rot||0)*Math.PI/180);
        workCtx.scale(es.scale,es.scale);workCtx.translate(-w/2,-h/2);
        let filterStr=(c.filter==="none"?"":c.filter+" ")+"brightness("+c.brightness+"%) contrast("+c.contrast+"%) saturate("+c.saturation+"%)";
        if(es.blur>0)filterStr+=" blur("+es.blur+"px)";
        drawVideo(workCtx,v,w,h,$("fitMode").value,filterStr,alpha,trans,progress);
        workCtx.restore();
        ctx.drawImage(workCanvas,0,0);
        if(es.flash>0){ctx.fillStyle=`rgba(255,255,255,${es.flash})`;ctx.fillRect(0,0,w,h)}
        const gt=clipStart+local;
        stickers.forEach(s=>drawSticker(ctx,s,w,h,gt));
        texts.forEach(t=>drawText(ctx,t,gt,w,h));
        drawCaption(ctx,gt,w,h);
        await new Promise(r=>setTimeout(r,30));elapsed=clipStart+local;
        btn.textContent=`Exporting ${Math.round(elapsed/total*100)}%`;
      }
      v.pause();if(audioEls[i])audioEls[i].gain.gain.value=0;elapsed=clipStart+clipDur;
    }
    rec.stop();await done;
    const blob=new Blob(chunks,{type:"video/webm"});
    finishExport(blob,"webm");
  }catch(err){if(rec.state!=="inactive")rec.stop();await done;throw err}
  finally{cleanup()}
  function cleanup(){
    musicEls.forEach(m=>m.el.pause());if(voiceEl)voiceEl.pause();
    sfxEls2.forEach(x=>x.el.pause());audioEls.forEach(x=>{x.el.pause();x.el.remove()});
    if(audioCtx)audioCtx.close().catch(()=>{});stream.getTracks().forEach(t=>t.stop());
  }
}

function finishExport(blob,ext){
  lastExportBlob=blob;const url=URL.createObjectURL(blob);
  $("downloadLink").href=url;$("downloadLink").download="pikora-export."+ext;$("downloadLink").style.display="block";
  $("downloadLink").textContent=`⬇ Download .${ext} (${(blob.size/1048576).toFixed(1)} MB)`;
  $("startExportBtn").textContent="✅ Done – Export Again";
  const shareBtn=$("shareExportBtn");
  if(navigator.canShare&&navigator.canShare({files:[new File([blob],"video."+ext,{type:blob.type})]})){
    shareBtn.style.display="block";
    shareBtn.onclick=async()=>{try{await navigator.share({files:[new File([blob],"video."+ext,{type:blob.type})],title:"My edit"})}catch(e){console.warn(e)}};
  }
  showToast("Export complete ✅","Download ready.");
}

function getExportSize(){const a=$("aspectRatio").value;
  if(a==="9:16")return[720,1280];if(a==="16:9")return[1280,720];if(a==="1:1")return[1080,1080];if(a==="4:5")return[864,1080];
  if(a==="original"&&preview.videoWidth)return[preview.videoWidth,preview.videoHeight];return[720,1280]}
function drawVideo(ctx,v,w,h,fit,filter,alpha,trans,progress){
  if(!v.videoWidth)return;ctx.save();ctx.globalAlpha=clamp(alpha,0,1);ctx.filter=filter||"none";
  const sc=fit==="cover"?Math.max(w/v.videoWidth,h/v.videoHeight):Math.min(w/v.videoWidth,h/v.videoHeight);
  let dw=v.videoWidth*sc,dh=v.videoHeight*sc,x=(w-dw)/2,y=(h-dh)/2;
  if(trans==="zoom"){const z=1+.15*(1-progress);dw*=z;dh*=z;x=(w-dw)/2;y=(h-dh)/2}
  if(trans==="slide")x+=(1-progress)*w*.5;
  if(trans==="wipe"){ctx.beginPath();ctx.rect(0,0,w*progress,h);ctx.clip()}
  ctx.drawImage(v,x,y,dw,dh);ctx.restore();
}
function drawSticker(ctx,s,w,h,gt){
  const k=w/720,a=stickerAnim(s,gt||0),size=s.size*k;
  const x=s.x/100*w+a.dx*k,y=s.y/100*h+a.dy*k;
  ctx.save();ctx.translate(x,y);ctx.rotate(((s.rot||0)+a.rot)*Math.PI/180);ctx.scale(a.sc,a.sc);
  if(s.type==="emoji"){ctx.font=`${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(s.value,0,0)}
  else if(s.type==="badge"){const b=BADGES[s.value]||BADGES[0],fs=size*.3;ctx.font=`800 ${fs}px ${fontStack("Montserrat")}`;const tw=ctx.measureText(b.t).width,bw=tw+fs*1.4,bh=fs*1.6;
    ctx.save();ctx.shadowColor="rgba(0,0,0,.35)";ctx.shadowBlur=fs*.3;ctx.shadowOffsetY=fs*.12;ctx.fillStyle=b.bg;roundRect(ctx,-bw/2,-bh/2,bw,bh,fs*.45);ctx.fill();ctx.restore();
    ctx.fillStyle=b.fg;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(b.t,0,fs*.04)}
  else if(s.type==="rect"){ctx.fillStyle=s.color;ctx.fillRect(-size/2,-size*.3,size,size*.6)}
  else if(s.type==="circle"){ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(0,0,size/2,0,Math.PI*2);ctx.fill()}
  else if(s.type==="image"){const im=s.img||imgCache[s.src];if(im){const ih=size*(im.height/im.width);ctx.drawImage(im,-size/2,-ih/2,size,ih)}}
  ctx.restore();
}
function drawText(ctx,t,gt,w,h){
  const a=textAnim(t,gt);if(!a||a.op<=0)return;
  const k=w/720,size=t.size*k;
  let str=String(t.text||"");if(a.chars<str.length)str=str.slice(0,a.chars);if(!str.trim())return;
  ctx.save();ctx.globalAlpha=clamp(a.op*(t.opacity||100)/100,0,1);
  ctx.font=`${t.italic?"italic ":""}${t.bold===false?400:800} ${size}px ${fontStack(t.fontFamily||t.font)}`;
  if("letterSpacing" in ctx)ctx.letterSpacing=((t.letterSpacing||0)*k)+"px";
  if(a.blur>0)ctx.filter=`blur(${a.blur*k}px)`;
  ctx.textBaseline="middle";
  const lines=wrapLines(ctx,str,w*.9-12*k),lh=size*1.25,bw=Math.max(...lines.map(l=>ctx.measureText(l).width)),totalH=lines.length*lh;
  ctx.translate(w*(t.x+a.dx)/100,h*(t.y+a.dy)/100);ctx.rotate(((t.rotation||0)+a.rot)*Math.PI/180);ctx.scale(a.sc,a.sc);
  if(t.backgroundEnabled){const px=.35*size,py=.12*size;ctx.save();ctx.fillStyle=hexA(t.backgroundColor,(t.bgOpacity??70)/100);roundRect(ctx,-bw/2-px,-totalH/2-py,bw+px*2,totalH+py*2,.18*size);ctx.fill();ctx.restore()}
  const align=t.align||"center";ctx.textAlign=align;const ax=align==="left"?-bw/2:align==="right"?bw/2:0;
  const shadowOn=c2=>{c2.shadowColor=t.shadowColor||"#000";c2.shadowBlur=(t.shadowBlur??8)*k;c2.shadowOffsetX=3*k;c2.shadowOffsetY=3*k};
  lines.forEach((l,i)=>{
    const y=(i-(lines.length-1)/2)*lh;
    if(t.glowEnabled){ctx.save();ctx.shadowColor=t.glowColor||"#00e5ff";ctx.fillStyle=t.color;[30,16,6].forEach(b=>{ctx.shadowBlur=b*k;ctx.fillText(l,ax,y)});ctx.restore()}
    if((t.outlineWidth||0)>0){ctx.save();if(t.shadowEnabled)shadowOn(ctx);ctx.lineWidth=t.outlineWidth*k;ctx.lineJoin="round";ctx.strokeStyle=t.outlineColor||"#000";ctx.strokeText(l,ax,y);ctx.restore()}
    ctx.save();if(t.shadowEnabled&&!((t.outlineWidth||0)>0))shadowOn(ctx);ctx.fillStyle=t.color;ctx.fillText(l,ax,y);ctx.restore();
  });
  ctx.restore();
}
function drawCaption(ctx,gt,w,h){
  const cap=captions.find(c=>gt>=c.start&&gt<=c.end);if(!cap)return;
  const size=captionStyle.size*(w/720);
  ctx.save();ctx.font=`bold ${size}px ${fontStack("Montserrat")}`;ctx.textAlign="center";ctx.textBaseline="middle";
  const words=cap.text.split(" ");const lines=[];let cur="";
  for(const wd of words){const test=cur?cur+" "+wd:wd;if(ctx.measureText(test).width>w*.85&&cur){lines.push(cur);cur=wd}else cur=test}
  if(cur)lines.push(cur);
  const lh=size*1.3,boxH=lines.length*lh+size*.7,maxW=Math.max(...lines.map(l=>ctx.measureText(l).width))+size;
  const y=h*.92;
  ctx.fillStyle=captionStyle.bg;ctx.fillRect(w/2-maxW/2,y-boxH/2,maxW,boxH);
  ctx.fillStyle=captionStyle.color;
  lines.forEach((l,i)=>ctx.fillText(l,w/2,y-boxH/2+size*.35+lh*(i+.5)));
  ctx.restore();
}

["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files")){e.preventDefault();document.body.classList.add("dragging")}}));
document.addEventListener("dragleave",e=>{if(!e.relatedTarget)document.body.classList.remove("dragging")});
document.addEventListener("drop",e=>{
  if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();document.body.classList.remove("dragging");
  const files=[...e.dataTransfer.files],vids=files.filter(f=>f.type.startsWith("video/")),aud=files.find(f=>f.type.startsWith("audio/"));
  if(aud&&!vids.length){setMusicSource(URL.createObjectURL(aud),aud.name,true);showToast("Music loaded","Dropped audio.");return}
  if(!vids.length){showToast("Video only","Drop a video file.");return}
  const dt=new DataTransfer();vids.forEach(f=>dt.items.add(f));$("videoFiles").files=dt.files;$("videoFiles").dispatchEvent(new Event("change"));
});

document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const k=e.key.toLowerCase();
  if(k===" "){e.preventDefault();preview.paused?$("playBtn").click():$("pauseBtn").click()}
  else if(k==="s"&&!e.ctrlKey&&!e.metaKey){doSplit()}
  else if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();(e.shiftKey?$("redoBtn"):$("undoBtn")).click()}
  else if((e.ctrlKey||e.metaKey)&&k==="y"){e.preventDefault();$("redoBtn").click()}
});
