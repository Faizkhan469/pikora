  $("speedClipNote").textContent=c?"Speed for clip: "+c.name:"Upload a video and select a clip first.";
  const sp=c?c.speed:1;
  g.innerHTML=SPEEDS.map(v=>`<div class="anim-card ${Math.abs(sp-v)<.001?"on":""}" onclick="setClipSpeed(${v})"><b>${v<1?"🐢":v>1?"🐇":"▶️"}</b>${v}x</div>`).join("");
  $("speedRange").value=sp;$("speedVal").textContent=sp+"x";
}
window.setClipSpeed=v=>{const c=clips[selectedClip];if(!c){showToast("No clip","Upload a video first.");return}snapshot();c.speed=+v;preview.playbackRate=c.speed;renderAll();showToast("Speed "+v+"x",v<1?"Slow motion":v>1?"Fast forward":"Normal speed")};
function wireSpeedPanel(){
  paintSpeed();let snap=false;
  $("speedRange").addEventListener("input",e=>{const c=clips[selectedClip];if(!c)return;if(!snap){snapshot();snap=true}c.speed=+e.target.value;preview.playbackRate=c.speed;$("speedVal").textContent=c.speed+"x";renderTimeline();updateTimeInfo()});
  $("speedRange").addEventListener("change",()=>{snap=false;paintSpeed()});
  $("speedAllBtn").onclick=()=>{const c=clips[selectedClip];if(!c)return;snapshot();clips.forEach(x=>x.speed=c.speed);renderAll();showToast("Done ✅","All clips at "+c.speed+"x.")};
}

/* ---------- MUSIC LIBRARY ---------- */
let audioTab="songs",musicCredit="";
const tabResults={},lastQuery={};
const SONG_CHIPS=[["Bollywood","bollywood hits"],["Punjabi","punjabi"],["Arijit Singh","arijit singh"],["Naat","naat"],["Nasheed","nasheed"],["Quran","quran recitation"],["Arabic","arabic music"],["Turkish","turkish pop"],["Pakistani","coke studio"],["K-pop","kpop"],["Lo-fi","lofi"],["Hip hop","hip hop"],["EDM","edm dance"],["Romantic","romantic songs"]];
const FULL_CHIPS=[["Cinematic","cinematic"],["Happy","happy"],["Chill","chill"],["Lo-fi","lofi"],["Piano","piano"],["Arabic / Oud","oud"],["Indian","indian"],["Sitar","sitar"],["Hip hop","hip hop"],["Electronic","electronic"],["Rock","rock"],["Acoustic","acoustic guitar"],["Sad","sad"],["Epic","epic"],["Ambient","ambient"],["Kids","kids"],["Vlog","vlog"]];
const SFX_CHIPS=[["Whoosh","whoosh"],["Pop","pop"],["Applause","applause"],["Laugh","laugh"],["Ding","ding"],["Boom","boom"],["Click","click"],["Camera","camera shutter"],["Cash","cash register"],["Drum roll","drum roll"],["Swoosh","swoosh"],["Notification","notification"],["Typing","typing"],["Cheer","crowd cheer"],["Heartbeat","heartbeat"],["Rain","rain"],["Wind","wind"],["Birds","birds"],["Glitch","glitch"],["Scratch","record scratch"],["Bell","bell"],["Fail","fail"]];
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb="pkcb"+Date.now()+Math.floor(Math.random()*1e5);const s=document.createElement("script");
    const done=()=>{clearTimeout(tm);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()};
    const tm=setTimeout(()=>{done();rej(new Error("timeout"))},9000);
    window[cb]=d=>{done();res(d)};
    s.onerror=()=>{done();rej(new Error("jsonp failed"))};
    s.src=url+(url.includes("?")?"&":"?")+"output=jsonp&callback="+cb;
    document.head.appendChild(s);
  });
}
function mapDeezer(d){return (d&&d.data||[]).filter(t=>t.preview).map(t=>({kind:"song",title:t.title||"Untitled",creator:t.artist?.name||"Unknown",duration:30000,preview:t.preview,cover:t.album?.cover_small||"",licenseLabel:"Deezer preview"}))}
async function getDeezer(q){return mapDeezer(await jsonp("https://api.deezer.com/search?q="+encodeURIComponent(q)+"&limit=25"))}
async function getiTunes(q){
  const r=await fetch("https://itunes.apple.com/search?term="+encodeURIComponent(q)+"&media=music&entity=song&limit=25");
  if(!r.ok)throw new Error("itunes "+r.status);
  const d=await r.json();
  return (d.results||[]).filter(t=>t.previewUrl).map(t=>({kind:"song",title:t.trackName||"Untitled",creator:t.artistName||"Unknown",duration:30000,preview:t.previewUrl,cover:t.artworkUrl60||t.artworkUrl100||"",licenseLabel:"Apple preview"}));
}
function licLabel(l,v){l=String(l||"").toLowerCase();if(l==="cc0")return "CC0 · no credit needed";if(l==="pdm")return "Public domain";return "CC "+l.toUpperCase()+(v?" "+v:"")}
async function getOpenverse(q,mode){
  const key="pk-ov|"+mode+"|"+q.toLowerCase();
  try{const c=sessionStorage.getItem(key);if(c)return JSON.parse(c)}catch(e){}
  const p=new URLSearchParams({q,page_size:"20",mature:"false"});
  if(mode==="sfx"){p.set("source","freesound");p.set("length","shortest")}
  else{p.set("source","jamendo");p.set("length","short,medium,long")}
  const r=await fetch("https://api.openverse.org/v1/audio/?"+p);
  if(r.status===429)throw new Error("limit");
  if(!r.ok)throw new Error("openverse "+r.status);
  const d=await r.json();
  const out=(d.results||[]).filter(t=>t.url).map(t=>{const lic=licLabel(t.license,t.license_version);const from=t.source==="jamendo"?"Jamendo":"Freesound";
    return{kind:mode==="sfx"?"sfx":"full",title:t.title||"Untitled",creator:t.creator||"Unknown",duration:t.duration||0,preview:t.url,licenseLabel:lic,
      credit:`Music: "${t.title}" by ${t.creator} (${lic}, ${from})`}});
  try{sessionStorage.setItem(key,JSON.stringify(out))}catch(e){}
  return out;
}
function dedupe(arr){const seen=new Set();return arr.filter(t=>{const k=(t.title+"|"+t.creator).toLowerCase().replace(/[^a-z0-9\u0600-\u06ff\u0900-\u097f|]/g,"");if(seen.has(k))return false;seen.add(k);return true})}
function renderAudioTab(){
  const body=$("audioTabBody");if(!body)return;
  document.querySelectorAll("#audioTabs .tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===audioTab));
  const chips=arr=>arr.map(([l,q])=>`<button class="chip" type="button" data-q="${esc(q)}">${l}</button>`).join("");
  const search=ph=>`<div style="display:flex;gap:6px"><input type="text" id="musicSearch" placeholder="${ph}" style="margin-bottom:0" value="${esc(lastQuery[audioTab]||"")}"><button class="act" id="musicSearchBtn" type="button" style="width:auto;margin-top:0;padding:0 14px">🔍</button></div>`;
  if(audioTab==="songs")body.innerHTML=search("Any song, artist or language…")+`<div class="chips"><button class="chip trend" type="button" id="trendingBtn">🔥 Trending now</button>${chips(SONG_CHIPS)}</div><div id="musicResults"></div><div class="note">⚠️ 30-second clips from Apple Music &amp; Deezer. These songs are copyrighted, so Instagram, TikTok or YouTube may mute your video. For music that's safe to post, use <b>Free full songs</b>.</div>`;
  else if(audioTab==="full")body.innerHTML=search("Mood, genre or instrument…")+`<div class="chips">${chips(FULL_CHIPS)}</div><div id="musicResults"></div><div class="note">✅ Complete songs from Jamendo, free under Creative Commons. Paste the credit shown under the music settings into your post.</div>`;
  else if(audioTab==="sfx")body.innerHTML=search("whoosh, pop, applause…")+`<div class="chips">${chips(SFX_CHIPS)}</div><div id="sfxList"></div><div id="musicResults"></div><div class="note">Sounds are added at the red playhead. Drag the pink block on the timeline to move it. From Freesound.</div>`;
  else body.innerHTML=`<label class="upload-zone" for="musicFile" style="padding:14px"><span>📁</span><strong>Upload a full song from your device</strong><br><small>MP3, WAV, M4A</small></label>
    <label style="margin-top:12px">Use the sound from one of your clips</label>
    ${clips.length?clips.map((c,i)=>`<div class="track-res">${c.thumb?`<img src="${c.thumb}" alt="">`:'<div class="cov">🎞</div>'}<div class="info"><div class="t">${esc(c.name)}</div><div class="m">${fmt(c.duration)}s</div></div><button class="icon-btn add" type="button" onclick="useClipSound(${i})">Use sound</button></div>`).join(""):'<div class="note">Upload a video first.</div>'}
    <div class="toggle-row"><input type="checkbox" id="muteAfterExtract" checked><span>Mute the clips' own sound after</span></div>`;
  const inp=$("musicSearch");
  if(inp){
    const go=()=>runAudioSearch(inp.value.trim());
    $("musicSearchBtn").onclick=go;inp.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
    body.querySelectorAll(".chip[data-q]").forEach(b=>b.onclick=()=>{inp.value=b.dataset.q;go()});
    if($("trendingBtn"))$("trendingBtn").onclick=searchTrending;
    if(tabResults[audioTab]){libResults=tabResults[audioTab];renderLibResults()}
    else if(audioTab==="songs")searchTrending();
    else if(audioTab==="full"){inp.value="cinematic";go()}
  }
  if(audioTab==="sfx")renderSfxList();
}
async function runAudioSearch(q){
  if(!q){showToast("Type a word","Any song, artist, mood or sound");return}
  lastQuery[audioTab]=q;const tab=audioTab;
  const box=$("musicResults");if(!box)return;
  box.innerHTML='<div class="note">Searching…</div>';stopLib();
  let out=[];
  try{
    if(tab==="songs"){
      const res=await Promise.allSettled([getiTunes(q),getDeezer(q)]);
      const ok=res.filter(r=>r.status==="fulfilled").map(r=>r.value);
      if(!ok.length)throw new Error("offline");
      const mx=Math.max(...ok.map(a=>a.length));for(let i=0;i<mx;i++)ok.forEach(a=>{if(a[i])out.push(a[i])});
      out=dedupe(out);
    }else out=await getOpenverse(q,tab==="sfx"?"sfx":"full");
  }catch(e){
    if(audioTab===tab&&$("musicResults"))$("musicResults").innerHTML=`<div class="note">${e.message==="limit"?"Too many searches right now. Wait a minute and try again.":"Could not load. Check your internet and try again."}</div>`;
    return;
  }
  tabResults[tab]=out;
  if(audioTab===tab){libResults=out;renderLibResults()}
}
async function searchTrending(){
  const box=$("musicResults");if(!box)return;
  box.innerHTML='<div class="note">Loading what\'s trending…</div>';stopLib();
  try{const out=mapDeezer(await jsonp("https://api.deezer.com/chart/0/tracks?limit=40"));if(!out.length)throw 0;tabResults.songs=out;libResults=out;renderLibResults()}
  catch(e){runAudioSearch("top hits")}
}
let libResults=[],libAudio=new Audio(),libNow=-1;
function renderLibResults(){
  const box=$("musicResults");if(!box)return;
  if(!libResults.length){box.innerHTML='<div class="note">Nothing found. Try another word.</div>';return}
  box.innerHTML=libResults.map((t,i)=>{
    const sec=Math.round((t.duration||0)/1000),d=t.kind!=="song"&&sec?Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"):"";
    const badge=t.kind==="song"?'<span class="badge prev">30s</span>':t.kind==="full"?'<span class="badge full">FULL · FREE</span>':'<span class="badge sfx">SFX</span>';
    const cov=t.cover?`<img src="${esc(t.cover)}" loading="lazy" alt="">`:`<div class="cov">${t.kind==="sfx"?"💥":"🎼"}</div>`;
    return `<div class="track-res">${cov}<div class="info"><div class="t">${esc(t.title)}</div><div class="m">${badge}${esc(t.creator)}${d?" · "+d:""}${t.kind!=="song"?" · "+esc(t.licenseLabel):""}</div></div><button class="icon-btn lp" type="button" onclick="libPlay(${i})" title="Listen">▶</button><button class="icon-btn add" type="button" onclick="libAdd(${i})">${t.kind==="sfx"?"+ Add":"Use"}</button></div>`;
  }).join("");
  paintLib();
}
function paintLib(){document.querySelectorAll("#musicResults .lp").forEach((b,i)=>b.textContent=(i===libNow&&!libAudio.paused)?"⏹":"▶")}
function stopLib(){libAudio.pause();libNow=-1;paintLib()}
libAudio.addEventListener("ended",stopLib);
libAudio.addEventListener("pause",paintLib);
libAudio.addEventListener("playing",paintLib);
window.libPlay=async i=>{
  const t=libResults[i];if(!t||!t.preview)return;
  if(libNow===i&&!libAudio.paused){stopLib();return}
  unlockAudio();libAudio.pause();libNow=i;
  try{libAudio.src=t.preview;await libAudio.play();paintLib()}
  catch(e){libNow=-1;paintLib();showToast("Cannot play","Try another one.")}
};
window.libAdd=async i=>{
  const t=libResults[i];if(!t||!t.preview)return;
  stopLib();
  if(t.kind==="sfx"){await addSfx(t.preview,t.title,(t.duration||1000)/1000);return}
  showToast("Adding…",t.kind==="full"?"Downloading the full song":"Downloading 30s clip");
  const name=(t.title||"Untitled")+" – "+(t.creator||"Unknown")+(t.kind==="song"?" (30s)":"");
  try{
    const r=await fetch(t.preview);if(!r.ok)throw new Error("blocked");
    await setMusicSource(URL.createObjectURL(await r.blob()),name,true);
  }catch(err){await setMusicSource(t.preview,name,false)}
  musicCredit=t.kind==="full"?t.credit:"";paintMusicCredit();if($("drawerBody"))$("drawerBody").scrollTop=0;
  showToast("Music added ✅",t.kind==="full"?"Drag the box on the waveform to pick the part you like.":"Tip: mute the clip's own sound from the timeline.");
};
window.useClipSound=async i=>{
  const c=clips[i];if(!c)return;
  await setMusicSource(c.url,"Sound from "+c.name,false);
  musicCredit="";paintMusicCredit();
  if($("muteAfterExtract")?.checked){snapshot();clips.forEach(x=>x.muted=true);updateAllClipMuteVisuals()}
  showToast("Sound added ✅","The sound from "+c.name+" now plays as music.");
};
function paintMusicCredit(){const el=$("musicCredit");if(!el)return;el.innerHTML=musicCredit?`📝 Credit for your post: <b>${esc(musicCredit)}</b> <button class="icon-btn" type="button" id="copyCreditBtn" style="height:26px;min-width:0;padding:0 8px;font-size:10px">Copy</button>`:"";
  if($("copyCreditBtn"))$("copyCreditBtn").onclick=()=>{navigator.clipboard?.writeText(musicCredit).then(()=>showToast("Copied","Paste it in your post description."),()=>{})}}
$("musicFile").onchange=e=>{const f=e.target.files[0];if(!f)return;setMusicSource(URL.createObjectURL(f),f.name,true).then(()=>{musicCredit="";paintMusicCredit();showToast("Music added ✅",f.name)});e.target.value=""};

/* waveform part picker */
function drawMusicPicker(){
  const cv=$("musicPicker");if(!cv)return;
  const W=Math.max(100,cv.clientWidth||300),H=56;cv.width=W;cv.height=H;
  const x=cv.getContext("2d");x.clearRect(0,0,W,H);
  const dur=musicBuffer?musicBuffer.duration:(musicDuration||0);
  if(!dur){x.fillStyle="#71717a";x.font="11px sans-serif";x.fillText("Loading waveform…",10,32);if($("musicPartVal"))$("musicPartVal").textContent="";return}
  const acc=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#00e5ff";
  const win=Math.min(dur,Math.max(1,totalDuration()||dur));
  AS.musicOffset=clamp(AS.musicOffset,0,Math.max(0,dur-win));
  const bars=Math.floor(W/3);
  if(musicBuffer){const d=musicBuffer.getChannelData(0),step=Math.max(1,Math.floor(d.length/bars));
    for(let i=0;i<bars;i++){let m=0;for(let j=i*step;j<(i+1)*step&&j<d.length;j+=32){const v=Math.abs(d[j]);if(v>m)m=v}
      const bh=Math.max(2,m*(H-12)),t=i/bars*dur,inWin=t>=AS.musicOffset&&t<=AS.musicOffset+win;
      x.fillStyle=inWin?acc:"rgba(161,161,170,.4)";x.fillRect(i*3,(H-bh)/2,2,bh)}}
  const x0=AS.musicOffset/dur*W,x1=(AS.musicOffset+win)/dur*W;
  x.fillStyle="rgba(255,255,255,.06)";x.fillRect(x0,0,x1-x0,H);
  x.strokeStyle=acc;x.lineWidth=2;x.strokeRect(x0+1,1,Math.max(4,x1-x0-2),H-2);
  if($("musicPartVal"))$("musicPartVal").textContent=fmtT(AS.musicOffset)+" – "+fmtT(Math.min(dur,AS.musicOffset+win))+" of "+fmtT(dur);
}
function bindMusicPicker(){
  const cv=$("musicPicker");if(!cv)return;let down=false;
  const set=e=>{const dur=musicBuffer?musicBuffer.duration:(musicDuration||0);if(!dur)return;const r=cv.getBoundingClientRect();const win=Math.min(dur,Math.max(1,totalDuration()||dur));
    const t=(e.clientX-r.left)/r.width*dur;AS.musicOffset=+clamp(t-win/2,0,Math.max(0,dur-win)).toFixed(1);drawMusicPicker();
    if(musicPreviewEl&&!musicPreviewEl.paused)syncMusicPreview()};
  cv.addEventListener("pointerdown",e=>{if(!musicURL)return;e.preventDefault();snapshot();down=true;cv.setPointerCapture(e.pointerId);set(e)});
  cv.addEventListener("pointermove",e=>{if(down)set(e)});
  cv.addEventListener("pointerup",()=>{down=false});cv.addEventListener("pointercancel",()=>{down=false});
}

/* ---------- SOUND EFFECTS ---------- */
let sfx=[],selectedSfx=-1;const sfxEls=new Map();
async function addSfx(url,name,dur){
  if(!clips.length){showToast("No video","Upload a video first.");return}
  showToast("Adding sound…",name);
  let u=url;try{const r=await fetch(url);if(r.ok)u=URL.createObjectURL(await r.blob())}catch(e){}
  snapshot();
  const s={id:"s"+Date.now()+Math.floor(Math.random()*1e4),url:u,name:String(name||"Sound").slice(0,40),start:+globalTime().toFixed(2),duration:Math.max(.2,dur||1),volume:1};
  sfx.push(s);selectedSfx=sfx.length-1;
  const a=new Audio();a.preload="metadata";a.src=u;a.onloadedmetadata=()=>{if(isFinite(a.duration)&&a.duration>0){s.duration=a.duration;renderTimeline();renderSfxList()}};
  renderTimeline();renderSfxList();
  showToast("Sound added ✅","At "+fmtT(s.start)+". Drag the pink block on the timeline to move it.");
}
function renderSfxList(){
  const el=$("sfxList");if(!el)return;
  el.innerHTML=sfx.length?`<label>Sounds in your video</label>`+sfx.map((s,i)=>`<div class="track-res" style="${i===selectedSfx?"border-color:var(--accent)":""}"><div class="cov">💥</div><div class="info"><div class="t">${esc(s.name)}</div><div class="m">at ${fmt(s.start)}s · ${fmt(s.duration)}s long</div></div><button class="icon-btn" type="button" onclick="seekGlobal(${s.start})" title="Go to">⏱</button><button class="icon-btn" type="button" onclick="deleteSfx(${i})" title="Delete">🗑</button></div>`).join(""):"";
}
window.deleteSfx=i=>{if(!sfx[i])return;snapshot();sfx.splice(i,1);selectedSfx=-1;renderTimeline();renderSfxList()};
window.seekGlobal=seekGlobal;
function bindSfxBlock(b,s,i){
  b.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();
    if(e.target.classList.contains("x")){deleteSfx(i);return}
    const x0=e.clientX,s0=s.start;let moved=false;
    dragHelper(b,e,ev=>{const dx=ev.clientX-x0;if(!moved&&Math.abs(dx)<4)return;if(!moved){snapshot();moved=true}
      s.start=Math.max(0,Math.round((s0+dx/tlScale)*20)/20);b.style.left=(10+s.start*tlScale)+"px"},
    ()=>{selectedSfx=i;if(!moved){playingAll=false;preview.pause();seekGlobal(s.start)}renderTimeline();renderSfxList()});
  });
}
function syncSfxPreview(){
  const gt=globalTime(),playing=!preview.paused;
  sfx.forEach(s=>{
    let el=sfxEls.get(s.id);if(!el){el=new Audio(s.url);el.preload="auto";sfxEls.set(s.id,el)}
    const lt=gt-s.start;
    if(playing&&lt>=0&&lt<s.duration-.05){el.volume=clamp(s.volume??1,0,1);if(el.paused&&!el.ended){el.currentTime=lt;el.play().catch(()=>{})}else if(!el.paused&&Math.abs(el.currentTime-lt)>.35)el.currentTime=lt}
    else{if(!el.paused)el.pause();if(lt<0||!playing){if(el.ended||el.currentTime>0){try{el.currentTime=0}catch(e){}}}}
  });
  for(const [id,el] of sfxEls)if(!sfx.find(s=>s.id===id)){el.pause();sfxEls.delete(id)}
}

/* ---------- export helpers ---------- */
async function ensureFontsLoaded(){
  try{
    const fams=new Set(texts.map(t=>t.fontFamily).filter(Boolean).concat(["Montserrat","Noto Sans Arabic","Noto Sans Devanagari"]));
    const sample=texts.map(t=>t.text).join(" ")+" "+captions.map(c=>c.text).join(" ")+" Aa";
    await Promise.all([...fams].flatMap(f=>[document.fonts.load(`800 40px "${f}"`,sample),document.fonts.load(`400 40px "${f}"`,sample)]).map(p=>p.catch(()=>{})));
    await document.fonts.ready;
  }catch(e){}
}
new ResizeObserver(()=>updateFrame()).observe($("canvasContainer"));
new ResizeObserver(()=>{renderTimeline();if(currentPanel==="audio")drawMusicPicker()}).observe($("tracksScroll"));

renderAll();updateFrame();
