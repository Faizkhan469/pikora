<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pikora Pro - Video Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Anton&family=Baloo+2:wght@500;800&family=Bebas+Neue&family=Cairo:wght@400;700;900&family=Dancing+Script:wght@700&family=Lobster&family=Montserrat:wght@400;800&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Arabic:wght@400;800&family=Noto+Sans+Devanagari:wght@400;800&family=Oswald:wght@500;700&family=Pacifico&family=Permanent+Marker&family=Poppins:wght@400;800&family=Tajawal:wght@400;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#000000;--panel:#0b0b0b;--sidebar:#000000;--border:#262626;--hover:#1f1f1f;--accent:#00e5ff;--accent2:#3b82f6;--text:#f4f4f5;--muted:#a1a1aa;--onacc:#000;--track:#050505;--dots:#1a1a1a;--toolbar:#0b0b0b}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.topbar{height:48px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:50;gap:6px}
.topbar-left{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo{font-weight:800;font-size:16px;color:var(--accent);letter-spacing:1px}
.topbar-center{display:flex;gap:2px;flex:1;justify-content:center}
.topbar-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tool-btn{background:transparent;border:none;color:var(--muted);padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tool-btn:hover{background:var(--hover);color:var(--text)}
.btn-export{background:var(--accent);color:var(--onacc);border:none;padding:7px 14px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.btn-export:hover{filter:brightness(.92)}
.btn-export:disabled{opacity:.5;cursor:not-allowed}
.workspace{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0}
.stage-area{flex:1;min-height:0;background:var(--bg);display:flex;flex-direction:column;position:relative}
.canvas-container{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:20px 20px;position:relative}
#previewWrap{position:relative;background:#000;border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.6);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#preview{max-width:100%;max-height:100%;display:block}
#previewText{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.preview-overlay{pointer-events:auto;cursor:move;position:absolute;font-weight:700;text-align:center;text-shadow:2px 2px 4px rgba(0,0,0,.8);padding:4px;border:2px solid transparent;border-radius:4px;white-space:pre-wrap;width:max-content;max-width:90%;line-height:1.25;touch-action:none;overflow-wrap:break-word}
.preview-overlay.selected{border-color:var(--accent)}
#flashOverlay{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#captionLayer{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);pointer-events:none;text-align:center;max-width:90%;padding:6px 12px;border-radius:6px;font-weight:700;display:none}
.ratio-chip{position:absolute;left:8px;top:8px;z-index:3;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:2px 4px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.ratio-chip select{background:transparent;border:none;color:var(--text);font-size:12px;font-weight:600;padding:4px;cursor:pointer}
#previewWrap.empty{background:var(--panel);box-shadow:none;border:2px dashed var(--border);border-radius:6px}
#previewWrap.empty #preview{display:none}
#dropZone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;padding:12px;z-index:4}
#dropZone .plus{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--onacc);font-size:30px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
#dropZone b{font-size:15px}#dropZone small{color:var(--muted);font-size:12px}
body.dragging .stage-area{outline:3px dashed var(--accent);outline-offset:-6px}
.timeline-area{height:320px;flex-shrink:0;background:var(--panel);border-top:1px solid var(--border);display:flex;flex-direction:column;position:relative;z-index:10}
.resize-handle{position:absolute;top:-4px;left:0;right:0;height:8px;cursor:ns-resize;z-index:20;touch-action:none;background:transparent}
.resize-handle::after{content:"";position:absolute;top:3px;left:50%;transform:translateX(-50%);width:40px;height:3px;background:var(--border);border-radius:2px}
.resize-handle:hover::after{background:var(--accent)}
.timeline-toolbar{height:48px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;gap:6px;flex-wrap:nowrap;overflow-x:auto}
.play-controls{display:flex;gap:5px;align-items:center;flex-shrink:0}
.play-btn{background:var(--hover);border:none;color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.play-btn:hover{background:var(--accent);color:var(--onacc)}
.time-display{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;flex-shrink:0}
#seekBar{flex:1;accent-color:var(--accent);margin:0 4px;height:28px;cursor:pointer;min-width:50px}
.zoom-controls{display:flex;gap:3px;align-items:center;flex-shrink:0}
.zoom-btn{background:var(--hover);border:none;color:var(--text);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.zoom-btn:hover{background:var(--accent);color:var(--onacc)}
#tlZoom{width:60px;accent-color:var(--accent);flex-shrink:0}

/* TIMELINE TRACK LABELS & CONTROLS */
.timeline-tracks{flex:1;min-height:0;display:flex;background:var(--track);overflow:hidden}
.track-labels{flex:0 0 90px;background:var(--panel);border-right:1px solid var(--border);padding-top:26px;z-index:3;display:flex;flex-direction:column}
.track-label{flex:0 0 48px;min-height:0;display:flex;align-items:center;padding:0 6px;font-size:10px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:700;position:relative}
.track-label.video{background:linear-gradient(90deg,color-mix(in srgb,var(--accent2) 8%,transparent),transparent)}
.track-label.audio{background:linear-gradient(90deg,color-mix(in srgb,#7c3aed 8%,transparent),transparent)}
.track-label.text{background:linear-gradient(90deg,color-mix(in srgb,#8b5cf6 8%,transparent),transparent)}
.tl-actions{position:absolute;right:4px;display:flex;gap:2px;top:50%;transform:translateY(-50%)}
.tl-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);width:22px;height:22px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;padding:0}
.tl-btn:hover{background:var(--hover)}
.tl-btn.muted{background:#dc2626;color:#fff;border-color:#dc2626}
.tl-btn.del:hover{background:#dc2626;color:#fff;border-color:#dc2626}

.tracks-scroll{flex:1;min-width:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.tracks-content{position:relative;min-width:100%;min-height:100%}
.ruler{height:26px;border-bottom:1px solid var(--border);background:var(--panel);cursor:pointer;touch-action:none;position:sticky;top:0;z-index:5}
.ruler .mark{position:absolute;bottom:0;height:12px;border-left:1px solid var(--muted);padding-left:4px;font-size:9px;color:var(--muted);line-height:10px;pointer-events:none;font-weight:600}
.track-row{height:48px;border-bottom:1px solid var(--border);position:relative;background:var(--track)}
.track-row.text-track{background:color-mix(in srgb,#8b5cf6 3%,var(--track))}
.track-row.video-track{background:color-mix(in srgb,#3b82f6 3%,var(--track))}
.track-row.audio-track{background:color-mix(in srgb,#7c3aed 3%,var(--track))}
.clip-block{position:absolute;top:5px;bottom:5px;background:linear-gradient(180deg,#3b82f6,#2563eb);border-radius:5px;border:1.5px solid #60a5fa;cursor:grab;display:flex;align-items:center;padding:0 12px;font-size:10px;color:#fff;overflow:hidden;touch-action:none;box-shadow:0 2px 5px rgba(37,99,235,.3)}
.clip-block .cn{position:relative;z-index:1;text-shadow:0 1px 3px #000;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.clip-block.selected{border-color:#fff;box-shadow:0 0 0 2.5px color-mix(in srgb,var(--accent) 50%,transparent),0 2px 5px rgba(37,99,235,.3);z-index:4}
.clip-block.muted{opacity:.55;filter:saturate(.4)}
.clip-block .mute-badge{position:absolute;right:16px;top:2px;font-size:10px;z-index:2;pointer-events:none;text-shadow:0 1px 2px #000}
.th{position:absolute;top:0;bottom:0;width:12px;cursor:ew-resize;background:rgba(255,255,255,.15);opacity:0;z-index:3;touch-action:none;display:flex;align-items:center;justify-content:center}
.th::after{content:"";width:2px;height:20px;border-radius:2px;background:#fff;box-shadow:0 0 3px rgba(0,0,0,.5)}
.clip-block.selected .th,.clip-block:hover .th{opacity:1;background:rgba(0,0,0,.3)}
.th.l{left:0;border-radius:5px 0 0 5px}
.th.r{right:0;border-radius:0 5px 5px 0}
.tl-item{position:absolute;height:20px;border-radius:4px;font-size:9px;padding:0 6px;overflow:hidden;white-space:nowrap;line-height:20px;cursor:pointer;color:#fff;background:#8b5cf6;border:1px solid transparent;font-weight:600}
.tl-item.cp{background:#f59e0b;color:#1b1f27}
.tl-item.sel{border-color:#fff;box-shadow:0 0 0 2px #fff}
.tl-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;pointer-events:none}
.wave-block{position:absolute;top:5px;bottom:5px;background:linear-gradient(180deg,rgba(124,58,237,.85),rgba(109,40,217,.85));border-radius:5px;border:1.5px solid #a78bfa;overflow:hidden;cursor:grab;touch-action:none;box-shadow:0 2px 5px rgba(124,58,237,.35)}
.wave-block .wlabel{position:absolute;left:6px;top:2px;font-size:9px;color:#fff;font-weight:700;text-shadow:0 1px 2px #000;z-index:2;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 20px)}
.wave-block canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.voice-block{position:absolute;top:5px;bottom:5px;background:linear-gradient(180deg,rgba(234,88,12,.85),rgba(194,65,12,.85));border-radius:5px;border:1.5px solid #fb923c;overflow:hidden;cursor:grab;touch-action:none;box-shadow:0 2px 5px rgba(234,88,12,.35)}
.voice-block .wlabel{position:absolute;left:6px;top:2px;font-size:9px;color:#fff;font-weight:700;text-shadow:0 1px 2px #000;z-index:2;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 20px)}
.voice-block canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#playhead{position:absolute;top:0;bottom:0;width:0;z-index:10;pointer-events:none}
#playhead::after{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;background:#ff3860;box-shadow:0 0 6px rgba(255,56,96,.7)}
#playhead .head{position:absolute;left:-7px;top:0;width:14px;height:14px;background:#ff3860;border-radius:0 0 7px 7px;box-shadow:0 2px 6px rgba(0,0,0,.4);pointer-events:auto;cursor:ew-resize;touch-action:none}
#playhead .head::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:5px;height:5px;background:#fff;border-radius:50%}

.panel-drawer{position:fixed;left:0;right:0;bottom:56px;background:var(--panel);border-top:1px solid var(--border);border-radius:16px 16px 0 0;z-index:200;height:min(60vh,420px);display:flex;flex-direction:column;transform:translateY(calc(100% + 56px));transition:transform .28s cubic-bezier(.22,1,.36,1);box-shadow:0 -10px 40px rgba(0,0,0,.6);overflow:hidden;pointer-events:auto}
.panel-drawer.open{transform:translateY(0)}
.panel-drawer-handle{padding:8px;display:flex;justify-content:center;cursor:pointer;flex-shrink:0}
.panel-drawer-handle::after{content:"";width:40px;height:4px;background:var(--border);border-radius:2px}
.panel-drawer-title{padding:0 16px 10px;font-size:14px;font-weight:700;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.panel-drawer-close{background:var(--hover);border:none;color:var(--text);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px}
.panel-drawer-body{flex:1 1 auto;min-height:100px;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch;display:block}
.bottom-toolbar{height:56px;flex-shrink:0;background:var(--toolbar);border-top:1px solid var(--border);display:flex;overflow-x:auto;overflow-y:hidden;z-index:250;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bottom-toolbar::-webkit-scrollbar{display:none}
.btool{flex:0 0 auto;min-width:64px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:none;color:var(--muted);font-size:9.5px;cursor:pointer;padding:0 8px;border-top:2px solid transparent;transition:color .15s,border-color .15s;font-family:inherit;font-weight:600}
.btool span{font-size:18px;line-height:1}
.btool:hover{color:var(--text);background:var(--hover)}
.btool.active{color:var(--accent);border-top-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:20px 14px;text-align:center;color:var(--muted);cursor:pointer;transition:.2s;background:rgba(255,255,255,.02);display:block}
.upload-zone:hover{border-color:var(--accent);color:var(--accent)}
.upload-zone span{font-size:24px;display:block;margin-bottom:4px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.media-item{aspect-ratio:16/9;background:#000;border-radius:6px;position:relative;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:.15s}
.media-item:hover{border-color:var(--accent)}
.media-item.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.media-item img{width:100%;height:100%;object-fit:cover}
.media-item .dur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.8);font-size:9px;padding:1px 4px;border-radius:3px;font-weight:600;color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.trend{background:linear-gradient(90deg,#f97316,#ef4444);color:#fff;border:none;font-weight:700}
.panel-content label{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px;font-weight:600}
.panel-content input[type=text],.panel-content input[type=number],.panel-content select,.panel-content textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:6px;font-size:14px;margin-bottom:6px;font-family:inherit;min-height:38px}
.panel-content textarea{min-height:80px;resize:vertical}
.panel-content input[type=color]{width:100%;height:38px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:2px}
.panel-content input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 8px;height:28px}
.panel-content button.act{width:100%;background:var(--accent);color:var(--onacc);border:none;padding:11px;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;margin-top:4px;min-height:42px}
.panel-content button.act:hover{filter:brightness(.92)}
.panel-content button.sec{width:100%;background:var(--hover);color:var(--text);border:none;padding:11px;border-radius:6px;font-size:12px;cursor:pointer;margin-top:4px;min-height:42px}
.panel-content button.sec:hover{filter:brightness(1.15)}
.panel-content button.dan{background:#dc2626;color:#fff}.panel-content button.dan:hover{background:#b91c1c}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.4}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tool-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;transition:.15s;font-size:11px;min-height:54px}
.tool-card:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.tool-card.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.tool-card b{display:block;font-size:19px;margin-bottom:5px}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emoji-btn{background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:20px;padding:8px 0;cursor:pointer;text-align:center}
.emoji-btn:hover{border-color:var(--accent)}
.list-item{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:11px}
.list-item.selected{border-color:var(--accent)}
.list-item .t{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .m{color:var(--muted);font-size:10px;margin-top:2px}
.toast{position:fixed;top:60px;right:12px;left:auto;background:#fbbf24;color:#000;padding:12px 16px;border-radius:8px;font-size:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:300;display:none;max-width:min(300px,86vw)}
.toast.show{display:block;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.hidden{display:none!important}
input[type=file]{display:none}
#exportPanelFloat{position:fixed;right:12px;top:56px;width:300px;background:var(--panel);border:1px solid var(--border);border-radius:10px;z-index:300;box-shadow:0 20px 50px rgba(0,0,0,.6);padding:14px;overflow-y:auto;max-height:80vh}
.audio-status{position:fixed;bottom:70px;right:12px;background:var(--accent);color:var(--onacc);padding:8px 14px;border-radius:20px;font-size:11px;font-weight:700;z-index:99;display:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.audio-status.show{display:block}
#teleprompterOverlay{position:fixed;inset:0;background:#000;color:#fff;z-index:9999;overflow:hidden;display:none}
#teleprompterOverlay.show{display:block}
#tpInner{position:absolute;top:100%;left:0;right:0;padding:0 6vw;font-weight:700;line-height:1.4;white-space:pre-wrap;transition:transform linear}
#tpClose{position:fixed;top:16px;right:16px;background:#ff3860;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;z-index:10000;font-size:14px}
@media(max-width:700px){
  .topbar{height:44px;padding:0 8px}
  .logo{font-size:15px}
  .btn-export{padding:6px 12px;font-size:11px}
  .tool-btn{padding:5px 6px;font-size:11px}
  .timeline-area{height:250px}
  .track-row{height:44px}
  .track-labels{flex:0 0 80px;padding-top:22px}
  .track-label{font-size:9px;padding:0 4px;flex-basis:44px}
  .ruler{height:22px}
  .ruler .mark{font-size:8px}
  .time-display{font-size:10px}
  #tlZoom{width:44px}
  .play-btn{width:30px;height:30px;font-size:11px}
  .zoom-btn{width:26px;height:26px;font-size:12px}
  #exportPanelFloat{width:min(300px,92vw);right:8px;top:52px}
  .bottom-toolbar{height:54px}
  .btool{min-width:58px;font-size:9px;padding:0 6px}
  .btool span{font-size:17px}
  .panel-drawer{bottom:54px;height:min(65vh,460px);transform:translateY(calc(100% + 54px))}
  .canvas-container{padding:6px}
}
/* ===== Pikora v2 additions ===== */
.preview-overlay{text-shadow:none}
.track-label.audio{flex:0 0 72px!important;justify-content:space-around!important;gap:0!important}
.track-row.audio-track{height:72px!important}
.wave-block,.voice-block,.sfx-block{pointer-events:auto}
.sfx-block{position:absolute;top:2px;bottom:2px;background:linear-gradient(180deg,#ec4899,#be185d);border:1.5px solid #f9a8d4;border-radius:4px;color:#fff;font-size:9px;font-weight:700;padding:0 16px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none;display:flex;align-items:center}
.sfx-block.sel{border-color:#fff;box-shadow:0 0 0 2px #fff}
.sfx-block .x{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;background:rgba(0,0,0,.5);font-size:8px;line-height:13px;text-align:center;cursor:pointer}
.tl-item{cursor:grab;touch-action:none;padding:0 9px}
.tl-item::before,.tl-item::after{content:"";position:absolute;top:4px;bottom:4px;width:2px;border-radius:2px;background:rgba(255,255,255,.7)}
.tl-item::before{left:3px}.tl-item::after{right:3px}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:transparent;border:none;color:var(--muted);padding:8px 10px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.tab.on{background:var(--accent);color:var(--onacc)}
.track-res{display:flex;gap:8px;align-items:center;padding:7px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.track-res img,.track-res .cov{width:42px;height:42px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--hover);display:flex;align-items:center;justify-content:center;font-size:19px}
.track-res .info{flex:1;min-width:0}
.track-res .t{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-res .m{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:9px;font-weight:800;padding:1px 6px;border-radius:999px;margin-right:5px;vertical-align:1px}
.badge.full{background:#10b981;color:#000}.badge.prev{background:#f59e0b;color:#000}.badge.sfx{background:#ec4899;color:#fff}
.icon-btn{background:var(--hover);border:1px solid var(--border);color:var(--text);min-width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;padding:0 10px;flex-shrink:0;font-family:inherit}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn.add{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.font-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:200px;overflow-y:auto;padding:2px}
.font-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 4px;text-align:center;cursor:pointer;color:var(--text)}
.font-card .s{font-size:19px;line-height:1.5;white-space:nowrap;overflow:hidden}
.font-card .n{font-size:9px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font-card.on,.style-card.on,.anim-card.on,.fx-card.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.style-card{height:58px;border-radius:8px;border:1px solid var(--border);background:linear-gradient(135deg,#475569,#0f172a);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;font-size:19px;padding:4px;white-space:nowrap}
.style-card span{padding:1px 6px;border-radius:4px;line-height:1.3}
.anim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.anim-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 3px;text-align:center;cursor:pointer;font-size:10px;font-weight:600;color:var(--text)}
.anim-card b{display:block;font-size:16px;margin-bottom:3px}
.anim-card:hover b{animation:cardWiggle .6s}
@keyframes cardWiggle{0%,100%{transform:none}30%{transform:scale(1.25)}60%{transform:scale(.9)}}
.seg{display:flex;gap:4px;margin:4px 0 6px}
.seg button{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;min-height:36px;cursor:pointer;font-size:13px;font-family:inherit}
.seg button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.row{display:flex;gap:8px;align-items:center}
.toggle-row{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-size:12px;font-weight:600}
.toggle-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.panel-content .toggle-row input[type=color]{width:46px;height:30px;margin:0 0 0 auto;flex-shrink:0}
.section{border-top:1px solid var(--border);margin-top:12px;padding-top:4px}
.section > .h{font-size:12px;font-weight:800;margin:8px 0 6px;color:var(--text)}
.panel-content button:disabled{opacity:.45;cursor:not-allowed}
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.fx-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;text-align:center;font-size:10px;font-weight:700;color:var(--text)}
.fx-card .pv{aspect-ratio:1;position:relative;overflow:hidden;background:#000}
.fx-card .pv .m{width:100%;height:100%;object-fit:cover;display:block}
.fx-card .pv div.m{background:linear-gradient(135deg,#f97316,#8b5cf6 55%,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:26px}
.fx-card .pv .ov{position:absolute;inset:0;pointer-events:none;opacity:0}
.fx-card .lb{padding:5px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-shake .m{animation:pvShake .18s infinite}
@keyframes pvShake{0%,100%{transform:scale(1.1) translate(3px,1px)}25%{transform:scale(1.1) translate(-3px,-1px)}50%{transform:scale(1.1) translate(1px,-3px)}75%{transform:scale(1.1) translate(-1px,3px)}}
.fx-shakeHard .m{animation:pvShakeH .12s infinite}
@keyframes pvShakeH{0%,100%{transform:scale(1.2) translate(6px,3px) rotate(2deg)}50%{transform:scale(1.2) translate(-6px,-4px) rotate(-2deg)}}
.fx-zoompulse .m{animation:pvPulse 1.4s ease-in-out infinite}
@keyframes pvPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.fx-heartbeat .m{animation:pvBeat 1s infinite}
@keyframes pvBeat{0%,40%,100%{transform:scale(1)}12%{transform:scale(1.12)}28%{transform:scale(1.08)}}
.fx-smoothzoom .m{animation:pvPulse 3s ease-in-out infinite}
.fx-zoomin .m{animation:pvIn 3s linear infinite}
@keyframes pvIn{from{transform:scale(1)}to{transform:scale(1.35)}}
.fx-swing .m{animation:pvSwing 2s ease-in-out infinite}
@keyframes pvSwing{0%,100%{transform:scale(1.12) rotate(-4deg)}50%{transform:scale(1.12) rotate(4deg)}}
.fx-flash .ov{background:#fff;animation:pvFlash 1s infinite}
@keyframes pvFlash{0%,100%{opacity:0}25%{opacity:.65}}
.fx-glitch .m{animation:pvGlitch .9s steps(1) infinite}
@keyframes pvGlitch{0%{transform:none;filter:none}20%{transform:translate(-4px,0);filter:drop-shadow(4px 0 0 rgba(255,0,0,.7)) drop-shadow(-4px 0 0 rgba(0,255,255,.7))}25%{transform:translate(3px,1px);filter:hue-rotate(90deg)}30%{transform:none;filter:none}70%{transform:translate(2px,-1px);filter:drop-shadow(-3px 0 0 rgba(255,0,0,.7))}75%{transform:none;filter:none}}
.fx-rgbsplit .m{animation:pvRgb 1s ease-in-out infinite}
@keyframes pvRgb{0%,100%{filter:drop-shadow(3px 0 0 rgba(255,0,0,.6)) drop-shadow(-3px 0 0 rgba(0,255,255,.6))}50%{filter:drop-shadow(7px 0 0 rgba(255,0,0,.6)) drop-shadow(-7px 0 0 rgba(0,255,255,.6))}}
.fx-motionblur .m{animation:pvBlur 1.2s ease-in-out infinite}
@keyframes pvBlur{0%,100%{filter:blur(1px)}50%{filter:blur(3.5px)}}
.fx-vhs .m{filter:sepia(.4) saturate(1.3) contrast(1.1);animation:pvShake .5s infinite}
.fx-vhs .ov{opacity:1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
.fx-speedramp .m{animation:pvRamp 2s cubic-bezier(.8,0,.2,1) infinite}
@keyframes pvRamp{0%{transform:translateX(-12%) scale(1.3)}100%{transform:translateX(12%) scale(1.3)}}
#musicPicker{width:100%;height:56px;display:block;border-radius:8px;background:var(--bg);border:1px solid var(--border);cursor:pointer;touch-action:none;margin-bottom:4px}
.emoji-btn{line-height:1.2}
/* Layout: keep the video visible while a tool panel is open */
:root{--drawer-h:min(46vh,380px)}
@media(max-width:899px){
  .panel-drawer{height:var(--drawer-h)}
  body.panel-open .workspace{padding-bottom:var(--drawer-h)}
  body.panel-open .timeline-area{height:auto!important}
  body.panel-open .timeline-tracks,body.panel-open .resize-handle{display:none}
}
@media(min-width:900px){
  .panel-drawer{left:auto;right:0;top:48px;bottom:56px;width:380px;height:auto;border-radius:0;border-top:none;border-left:1px solid var(--border);transform:translateX(100%);box-shadow:-10px 0 30px rgba(0,0,0,.4)}
  .panel-drawer.open{transform:none}
  .panel-drawer-handle{display:none}
  .panel-drawer-title{padding-top:12px}
  body.panel-open .workspace{margin-right:380px}
  body.panel-open .toast{right:396px}
}
#audioInfo{font-size:12px;font-weight:800;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left"><div class="logo">PIKORA</div></div>
  <div class="topbar-center">
    <button class="tool-btn" id="undoBtn">↶ Undo</button>
    <button class="tool-btn" id="redoBtn">↷ Redo</button>
  </div>
  <div class="topbar-right">
    <button class="btn-export" id="goExport">Export</button>
  </div>
</header>

<div class="workspace">
  <main class="stage-area">
    <div class="canvas-container" id="canvasContainer">
      <div class="ratio-chip"><select id="quickRatio" title="Canvas ratio"><option value="9:16">9:16</option><option value="16:9">16:9</option><option value="1:1">1:1</option><option value="4:5">4:5</option><option value="original">Original</option></select></div>
      <div id="previewWrap" style="width:360px;height:640px">
        <video id="preview" playsinline></video>
        <div id="previewText"></div>
        <div id="captionLayer"></div>
        <div id="flashOverlay"></div>
        <label id="dropZone" for="videoFiles"><span class="plus">+</span><b>Click to upload</b><small>Or drag and drop file here</small></label>
      </div>
    </div>
    <div class="timeline-area" id="timelineArea">
      <div class="resize-handle" id="resizeHandle"></div>
      <div class="timeline-toolbar">
        <div class="play-controls">
          <button class="play-btn" id="playBtn" type="button">▶</button>
          <button class="play-btn" id="pauseBtn" type="button">❚❚</button>
          <button class="play-btn" id="stopBtn" type="button">■</button>
        </div>
        <div class="time-display" id="timeInfo">00:00 / 00:00</div>
        <input type="range" id="seekBar" min="0" max="1000" value="0">
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoomOut" type="button">−</button>
          <input type="range" id="tlZoom" min="30" max="240" value="80">
          <button class="zoom-btn" id="zoomIn" type="button">+</button>
        </div>
        <button class="tool-btn" id="splitBtn2" type="button">✂</button>
        <button class="tool-btn" id="delBtn2" type="button">🗑</button>
      </div>
      <div class="timeline-tracks">
        
        <!-- TRACK LABELS WITH INLINE CONTROLS -->
        <div class="track-labels">
          <div class="track-label text" style="justify-content:center">TEXT</div>
          <div class="track-label video">
            VIDEO
            <div class="tl-actions">
              <button class="tl-btn" id="tlMuteVideoBtn" title="Mute/Unmute Original Video Voice">🔊</button>
            </div>
          </div>
          <div class="track-label audio" style="flex-direction:column;justify-content:center;gap:4px;align-items:flex-start;padding-left:8px">
            <div style="display:flex;align-items:center;width:100%;justify-content:space-between">
              <span>MUSIC</span>
              <div class="tl-actions" style="position:static;transform:none">
                <button class="tl-btn" id="tlMuteMusicBtn" title="Mute/Unmute Music">🔊</button>
                <button class="tl-btn del" id="tlDelMusicBtn" title="Delete Music">🗑</button>
              </div>
            </div>
            <div style="display:flex;align-items:center;width:100%;justify-content:space-between">
              <span>VOICE</span>
              <div class="tl-actions" style="position:static;transform:none">
                <button class="tl-btn" id="tlMuteVoiceBtn" title="Mute/Unmute Voiceover">🔊</button>
                <button class="tl-btn del" id="tlDelVoiceBtn" title="Delete Voiceover">🗑</button>
              </div>
            </div>
            <div style="display:flex;align-items:center;width:100%;height:22px"><span>SFX</span></div>
          </div>
        </div>

        <div class="tracks-scroll" id="tracksScroll">
          <div class="tracks-content" id="tracksContent">
            <div class="ruler" id="ruler"></div>
            <div class="track-row text-track" id="textTrackRow"></div>
            <div class="track-row video-track" id="videoTrack"></div>
            <div class="track-row audio-track" id="audioTrackRow"></div>
            <div id="playhead"><div class="head"></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="panel-drawer" id="panelDrawer">
  <div class="panel-drawer-handle" id="drawerHandle"></div>
  <div class="panel-drawer-title" id="drawerTitle">
    <span id="drawerTitleText">Panel</span>
    <button class="panel-drawer-close" id="drawerClose" type="button">✕</button>
  </div>
  <div class="panel-drawer-body panel-content" id="drawerBody"></div>
</div>

<nav class="bottom-toolbar" id="bottomToolbar">
  <button class="btool" data-panel="media"><span>🎬</span>Media</button>
  <button class="btool" data-panel="audio"><span>🎵</span>Music</button>
  <button class="btool" data-panel="text"><span>T</span>Text</button>
  <button class="btool" data-panel="elements"><span>😀</span>Stickers</button>
  <button class="btool" data-panel="effects"><span>⭐</span>Effects</button>
  <button class="btool" data-panel="filters"><span>✨</span>Filters</button>
  <button class="btool" data-panel="speed"><span>⏩</span>Speed</button>
  <button class="btool" data-panel="transitions"><span>🔀</span>Transitions</button>
  <button class="btool" data-panel="voice"><span>🎙️</span>Voice</button>
  <button class="btool" data-panel="captions"><span>💬</span>Captions</button>
  <button class="btool" data-panel="templates"><span>📋</span>Templates</button>
  <button class="btool" data-panel="transcript"><span>📜</span>Transcript</button>
  <button class="btool" data-panel="teleprompter"><span>📖</span>Teleprompter</button>
  <button class="btool" data-panel="brand"><span>🎨</span>Brand Kit</button>
</nav>

<input type="file" id="videoFiles" accept="video/*" multiple>
<input type="file" id="srtFile" accept=".srt">
<input type="file" id="musicFile" accept="audio/*">
<input type="file" id="logoFile" accept="image/*">
<input type="file" id="voiceoverFile" accept="audio/*">

<div class="audio-status" id="audioStatus">🎵 Music playing</div>
<div class="toast" id="toast">
  <div style="font-weight:800;margin-bottom:4px" id="toastTitle">Ready</div>
  <div style="font-weight:400;font-size:11px;opacity:.8" id="toastMsg">Msg</div>
  <button onclick="document.getElementById('toast').classList.remove('show')" style="margin-top:8px;background:#000;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:11px">OK</button>
</div>

<div class="hidden" id="exportPanelFloat">
  <div style="font-weight:700;font-size:13px;margin-bottom:8px">Export Settings</div>
  <label style="display:block;font-size:11px;color:var(--muted);margin:8px 0 4px;font-weight:600">Aspect ratio</label>
  <select id="aspectRatio" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-size:14px"><option value="16:9">16:9 YouTube</option><option value="9:16" selected>9:16 TikTok/Reels</option><option value="1:1">1:1 Square</option><option value="4:5">4:5 Portrait</option><option value="original">Original</option></select>
  <label style="display:block;font-size:11px;color:var(--muted);margin:8px 0 4px;font-weight:600">Fit</label>
  <select id="fitMode" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-size:14px"><option value="contain">Fit (bars)</option><option value="cover" selected>Fill (crop)</option></select>
  <label style="display:block;font-size:11px;color:var(--muted);margin:8px 0 4px;font-weight:600">Quality</label>
  <select id="exportQuality" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-size:14px"><option value="2">Standard</option><option value="5" selected>High</option><option value="8">Ultra</option></select>
  <button class="act" id="startExportBtn" type="button" style="width:100%;background:var(--accent);color:var(--onacc);border:none;padding:14px;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;margin-top:10px;min-height:48px">🚀 Start Export</button>
  <a id="downloadLink" style="display:none;margin-top:8px;padding:12px;background:#10b981;color:#000;text-align:center;border-radius:6px;font-weight:700;text-decoration:none">⬇ Download Video</a>
  <button class="sec" id="shareExportBtn" type="button" style="display:none;width:100%;background:#8b5cf6;color:#fff;border:none;padding:12px;border-radius:6px;font-weight:700;margin-top:8px;min-height:42px;cursor:pointer">📤 Share</button>
  <button class="sec" onclick="document.getElementById('exportPanelFloat').classList.add('hidden')" style="width:100%;background:var(--hover);color:var(--text);border:none;padding:10px;border-radius:6px;margin-top:8px;min-height:40px;cursor:pointer">Close</button>
</div>

<div id="teleprompterOverlay"><div id="tpInner"></div><button id="tpClose">✕ Close</button></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const preview=$("preview"),previewWrap=$("previewWrap"),previewText=$("previewText"),captionLayer=$("captionLayer"),flashOverlay=$("flashOverlay"),seekBar=$("seekBar");
const fmt=n=>Number(n||0).toFixed(1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtT=t=>String(Math.floor(t/60)).padStart(2,"0")+":"+String(Math.floor(t%60)).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const durationOf=c=>Math.max(.1,(c.end-c.start)/c.speed);
const totalDuration=()=>clips.reduce((s,c)=>s+durationOf(c),0);
const musicStartVal=()=>AS.musicStart;

let clips=[],selectedClip=-1,texts=[],selectedText=-1,captions=[],selectedCaption=-1,stickers=[],selectedSticker=-1;
let captionStyle={size:28,color:"#ffffff",bg:"rgba(0,0,0,0.65)"};
let musicURL=null,musicDuration=0,musicPreviewEl=null,exporting=false,thumbJobs=new Set(),playingAll=false;
let audioUnlocked=false,forceMusicPlay=false,musicBuffer=null,musicName="",musicBlob=false;
let voiceoverURL=null,voiceoverName="",voiceoverDuration=0,voiceoverEl=null,voiceoverBlob=false;
let voiceBuffer=null;
let musicMuted = false;
let voiceMuted = false;
const imgCache={};
let tlScale=80,pendingSeek=null;
let currentPanel=null;
let lastExportBlob=null;
const AS={musicStart:0,musicVolume:.35,fadeIn:1,fadeOut:2,videoVolume:1,voiceStart:0,voiceVolume:1,musicOffset:0};

// HARD LOCK FOR PREVIEW MUTING
const _origMutedDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "muted");
let _forcedMute = false;
Object.defineProperty(preview, "muted", {
  configurable: true,
  get(){ return _forcedMute || _origMutedDesc.get.call(this); },
  set(v){ _origMutedDesc.set.call(this, _forcedMute ? true : v); }
});
const _origVolDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "volume");
Object.defineProperty(preview, "volume", {
  configurable: true,
  get(){ return _origVolDesc.get.call(this); },
  set(v){ _origVolDesc.set.call(this, _forcedMute ? 0 : v); }
});
function forceMuteOriginal(on){
  _forcedMute = !!on;
  preview.muted = _forcedMute;
  const vv = $("videoVolume");
  preview.volume = _forcedMute ? 0 : AS.videoVolume;
  document.querySelectorAll("video").forEach(v => {
    if(v !== preview && v.id !== "preview"){ v.muted = true; v.volume = 0; }
  });
}

function unlockAudio(){
  if(audioUnlocked)return;
  audioUnlocked=true;
  try{
    if(!musicPreviewEl){musicPreviewEl=new Audio();musicPreviewEl.volume=0.35;}
    const silent=new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=");
    silent.volume=0;
    const p=silent.play();
    if(p&&p.then)p.then(()=>{silent.pause()}).catch(()=>{});
  }catch(e){}
}
document.addEventListener("click",unlockAudio,{once:true});
document.addEventListener("touchstart",unlockAudio,{once:true});

let history=[],redoStack=[];
function stateJSON(){return JSON.stringify({clips,texts,captions,captionStyle,selectedClip,
  stickers:stickers.map(s=>{const o={...s};delete o.img;return o}),
  music:musicURL?{url:musicURL,name:musicName,isBlob:musicBlob,duration:musicDuration,muted:musicMuted}:null,
  voiceover:voiceoverURL?{url:voiceoverURL,name:voiceoverName,isBlob:voiceoverBlob,muted:voiceMuted}:null,as:{...AS},sfx:sfx.map(s=>({...s})),musicCredit})}

function restore(json){
  const o=JSON.parse(json);
  clips=o.clips;texts=o.texts;captions=o.captions;captionStyle=o.captionStyle;if(o.as)Object.assign(AS,o.as);sfx=o.sfx||[];musicCredit=o.musicCredit||"";
  stickers=o.stickers.map(st=>{if(st.type==="image"&&imgCache[st.src])st.img=imgCache[st.src];return st});
  selectedClip=Math.min(o.selectedClip,clips.length-1);selectedText=-1;selectedCaption=-1;selectedSticker=-1;
  if(o.music&&o.music.url){musicURL=o.music.url;musicName=o.music.name;musicBlob=!!o.music.isBlob;musicDuration=o.music.duration||0;musicMuted=!!o.music.muted;
    if(musicPreviewEl){musicPreviewEl.src=musicURL}}
  else{musicURL=null;musicName="";musicBuffer=null;musicDuration=0;musicMuted=false}
  if(o.voiceover&&o.voiceover.url){
    voiceoverURL=o.voiceover.url;voiceoverName=o.voiceover.name;voiceoverBlob=!!o.voiceover.isBlob;voiceMuted=!!o.voiceover.muted;
    if(!voiceoverEl)voiceoverEl=new Audio();
    voiceoverEl.src=voiceoverURL;
  }else{voiceoverURL=null;voiceoverName="";voiceMuted=false;if(voiceoverEl)voiceoverEl.removeAttribute("src")}
  if(selectedClip>=0)loadSelected();renderAll();
}

function openPanel(panelId){

  document.body.classList.add("panel-open");drawerBody.scrollTop=0;
  drawerBody.innerHTML=buildPanelHTML(panelId);
  drawer.classList.add("open");
  wirePanel(panelId);
}
function closePanel(){
  currentPanel=null;
  drawer.classList.remove("open");
  document.body.classList.remove("panel-open");
  document.querySelectorAll(".btool").forEach(b=>b.classList.remove("active"));
}
document.querySelectorAll(".btool").forEach(b=>{
  b.onclick=()=>{
    const id=b.dataset.panel;
    if(currentPanel===id)closePanel();
    else openPanel(id);
  };
});
$("drawerClose").onclick=closePanel;
$("drawerHandle").onclick=closePanel;

function wirePanel(panelId){
  if(panelId==="media"){
    $("setStartBtn").onclick=()=>{const c=clips[selectedClip];if(!c)return;const t=clamp(preview.currentTime,0,Math.max(0,(parseFloat($("trimEnd").value)||c.end)-0.05));$("trimStart").value=fmt(t)};
    $("setEndBtn").onclick=()=>{const c=clips[selectedClip];if(!c)return;const t=clamp(preview.currentTime,(parseFloat($("trimStart").value)||0)+0.05,c.duration||preview.duration||0);$("trimEnd").value=fmt(t)};
    $("applyTrimBtn").onclick=()=>{
      const c=clips[selectedClip];if(!c){showToast("No clip","Select a clip.");return}
      const dur=c.duration||preview.duration||0;
      let a=parseFloat($("trimStart").value),b=parseFloat($("trimEnd").value);
      if(!isFinite(a))a=c.start;if(!isFinite(b))b=c.end;
      a=clamp(a,0,dur);b=clamp(b,0,dur);
      if(b-a<0.05){showToast("Invalid trim","End after start.");return}
      snapshot();c.start=a;c.end=b;c.speed=parseFloat($("speed").value)||1;
      preview.playbackRate=c.speed;preview.pause();preview.currentTime=a;
      renderAll();showToast("Trim applied ✅",`${fmt(a)}s → ${fmt(b)}s`);
    };
    $("splitBtn").onclick=doSplit;
    $("deleteClipBtn").onclick=()=>{if(selectedClip<0)return;snapshot();playingAll=false;clips.splice(selectedClip,1);selectedClip=Math.min(selectedClip,clips.length-1);if(selectedClip>=0)loadSelected();else{preview.pause();preview.removeAttribute("src")}renderAll();closePanel()};
    $("dupClipBtn").onclick=()=>{const c=clips[selectedClip];if(!c)return;snapshot();clips.splice(selectedClip+1,0,{...c,name:c.name+" (copy)"});selectedClip++;loadSelected();renderAll()};
    $("moveLeftBtn").onclick=()=>moveClip(-1);
    $("moveRightBtn").onclick=()=>moveClip(1);
    renderMediaGrid();
    if(selectedClip>=0){$("clipControls").classList.remove("hidden");loadSelectedIntoPanel()}
  }
  if(panelId==="templates"){
    $("templateGrid").innerHTML=TEMPLATES.map((t,i)=>`<div class="tool-card" onclick="applyTemplate(${i})"><b>${t.icon}</b>${t.name}</div>`).join("");
  }
  if(panelId==="elements"){wireStickers()}
  if(panelId==="audio"){
    $("audioTabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{audioTab=b.dataset.tab;stopLib();renderAudioTab()});
    renderAudioTab();
    $("musicVolume").addEventListener("input",e=>{AS.musicVolume=+e.target.value;$("musicVolVal").textContent=Math.round(e.target.value*100)+"%";if(musicPreviewEl)musicPreviewEl.volume=AS.musicVolume});
    $("videoVolume").addEventListener("input",e=>{AS.videoVolume=+e.target.value;$("vidVolVal").textContent=Math.round(e.target.value*100)+"%";preview.volume=AS.videoVolume});
    $("musicStart").addEventListener("change",e=>{AS.musicStart=Math.max(0,+e.target.value||0);renderTimeline()});
    $("musicFadeIn").addEventListener("change",e=>{AS.fadeIn=Math.max(0,+e.target.value||0)});
    $("musicFadeOut").addEventListener("change",e=>{AS.fadeOut=Math.max(0,+e.target.value||0)});
    $("previewMusicBtn").onclick=previewMusic;
    $("removeMusicBtn").onclick=removeMusic;
    if(musicURL){$("audioControls").classList.remove("hidden");$("audioInfo").textContent="🎵 "+musicName}
    paintMusicCredit();bindMusicPicker();requestAnimationFrame(drawMusicPicker);
  }
  if(panelId==="voice"){
    $("voiceoverFile").onchange=async e=>{
      const f=e.target.files[0];if(!f)return;
      const url=URL.createObjectURL(f);
      await setVoiceover(url,f.name,true);
      e.target.value="";
    };
    $("voiceStart").addEventListener("change",e=>{AS.voiceStart=Math.max(0,+e.target.value||0);renderTimeline()});
    $("voiceVolume").addEventListener("input",e=>{
      $("voiceVolVal").textContent=Math.round(e.target.value*100)+"%";
      AS.voiceVolume=+e.target.value;if(voiceoverEl)voiceoverEl.volume=AS.voiceVolume;
    });
    $("voicePreviewBtn").onclick=()=>{
      if(!voiceoverURL){showToast("No voiceover","Upload one first.");return}
      unlockAudio();
      if(!voiceoverEl){voiceoverEl=new Audio(voiceoverURL);}
      voiceoverEl.currentTime=0;
      voiceoverEl.volume=AS.voiceVolume;
      voiceoverEl.play().catch(()=>showToast("Blocked","Tap once first."));
    };
    $("removeVoiceoverBtn").onclick=removeVoiceover;
    $("muteAllBtn").onclick=()=>{snapshot();clips.forEach(c=>c.muted=true);forceMuteOriginal(true);renderVoicePanel();renderTimeline();showToast("Muted","All clips silent.")};
    $("unmuteAllBtn").onclick=()=>{snapshot();clips.forEach(c=>c.muted=false);forceMuteOriginal(false);renderVoicePanel();renderTimeline();showToast("Unmuted","All clips sound on.")};
    if(voiceoverURL){$("voiceoverControls").classList.remove("hidden");$("voiceoverInfo").textContent="🎙️ "+voiceoverName;$("voiceLenVal").textContent=voiceoverDuration.toFixed(1)}

async function handleVideoUpload(e){

    clips.push(c);

      v.onloadedmetadata=()=>{c.duration=Number.isFinite(v.duration)?v.duration:0;c.end=c.duration;v.removeAttribute("src");res()};

function makeThumbnail(c){
  if(c.thumb||thumbJobs.has(c.url))return;thumbJobs.add(c.url);
  const v=document.createElement("video");v.preload="auto";v.muted=true;v.src=c.url;
  const finish=()=>{thumbJobs.delete(c.url);v.removeAttribute("src");renderTimeline()};
  v.onloadedmetadata=()=>{try{v.currentTime=Math.min(1,v.duration*.15)}catch(e){finish()}};
  v.onseeked=()=>{try{const cv=document.createElement("canvas");cv.width=160;cv.height=90;const x=cv.getContext("2d");
    const vr=v.videoWidth/v.videoHeight,cr=160/90;let dw,dh,dx,dy;
    if(vr>cr){dw=160;dh=160/vr;dx=0;dy=(90-dh)/2}else{dh=90;dw=90*vr;dx=(160-dw)/2;dy=0}
    x.fillStyle="#000";x.fillRect(0,0,160,90);x.drawImage(v,dx,dy,dw,dh);c.thumb=cv.toDataURL("image/jpeg",.7);}catch(e){}finish();};
  v.onerror=finish;
}

async function decodeMusic(url){
  try{
    const res=await fetch(url);const arr=await res.arrayBuffer();
    const AC=window.AudioContext||window.webkitAudioContext;

  }catch(e){return null}
}
function drawWaveform(cv){
  const c2=cv.getContext("2d");const W=cv.width,H=cv.height;
  c2.fillStyle="rgba(124,58,237,.3)";c2.fillRect(0,0,W,H);
  if(!musicBuffer){c2.strokeStyle="rgba(167,139,250,.6)";c2.lineWidth=1;c2.beginPath();c2.moveTo(0,H/2);c2.lineTo(W,H/2);c2.stroke();return}
  const data=musicBuffer.getChannelData(0);const step=Math.max(1,Math.floor(data.length/W));const amp=H/2;
  c2.fillStyle="rgba(196,181,253,.95)";
  for(let i=0;i<W;i++){let min=1,max=-1;const start=i*step;const end=Math.min(start+step,data.length);
    for(let j=start;j<end;j++){const v=data[j];if(v<min)min=v;if(v>max)max=v}
    const y1=(1-max)*amp,y2=(1-min)*amp;c2.fillRect(i,y1,1,Math.max(1,y2-y1));}
  c2.strokeStyle="rgba(255,255,255,.25)";c2.lineWidth=1;c2.beginPath();c2.moveTo(0,H/2);c2.lineTo(W,H/2);c2.stroke();
}
function drawVoiceWave(cv){
  const c2=cv.getContext("2d");const W=cv.width,H=cv.height;
  c2.fillStyle="rgba(234,88,12,.3)";c2.fillRect(0,0,W,H);
  if(!voiceBuffer){c2.strokeStyle="rgba(251,146,60,.6)";c2.lineWidth=1;c2.beginPath();c2.moveTo(0,H/2);c2.lineTo(W,H/2);c2.stroke();return}
  const data=voiceBuffer.getChannelData(0);const step=Math.max(1,Math.floor(data.length/W));const amp=H/2;
  c2.fillStyle="rgba(254,215,170,.95)";
  for(let i=0;i<W;i++){let min=1,max=-1;const start=i*step;const end=Math.min(start+step,data.length);
    for(let j=start;j<end;j++){const v=data[j];if(v<min)min=v;if(v>max)max=v}
    const y1=(1-max)*amp,y2=(1-min)*amp;c2.fillRect(i,y1,1,Math.max(1,y2-y1));}
  c2.strokeStyle="rgba(255,255,255,.25)";c2.lineWidth=1;c2.beginPath();c2.moveTo(0,H/2);c2.lineTo(W,H/2);c2.stroke();
}
function bindWaveBlock(w,startVal,inputId){
  let x0=0,s0=startVal,dragging=false,moved=false;
  w.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();w.setPointerCapture(e.pointerId);x0=e.clientX;s0=startVal;dragging=true;moved=false});
  w.addEventListener("pointermove",e=>{
    if(!dragging)return;const dx=(e.clientX-x0)/tlScale;
    if(Math.abs(dx)>0.05)moved=true;
    const ns=Math.max(0,Math.round((s0+dx)*10)/10);
    AS[inputId]=ns;if($(inputId))$(inputId).value=ns;
    w.style.left=(10+ns*tlScale)+"px";
    if(inputId==="voiceStart"&&voiceoverEl)voiceoverEl.currentTime=ns;
  });
  w.addEventListener("pointerup",()=>{if(dragging&&moved)snapshot();dragging=false});
  w.addEventListener("pointercancel",()=>{dragging=false});
}
function xToTime(clientX){return(clientX-$("tracksContent").getBoundingClientRect().left-10)/tlScale}
function seekGlobal(t){
  if(!clips.length)return;
  t=clamp(t,0,Math.max(0,totalDuration()-0.02));
  let acc=0,idx=clips.length-1,off=0;
  for(let i=0;i<clips.length;i++){const d=durationOf(clips[i]);off=t-acc;idx=i;if(t<acc+d)break;acc+=d}
  const c=clips[idx],ct=clamp(c.start+off*c.speed,c.start,Math.max(c.start,c.end-0.03));
  if(idx===selectedClip){preview.currentTime=ct;updateTimeInfo();updatePreviewText();updateCaptionLayer();syncSeekBar()}
  else{playingAll=false;preview.pause();selectedClip=idx;pendingSeek=ct;loadSelected();renderAll()}
}

}
function dragHelper(el,e,onMove,onUp){
  el.setPointerCapture(e.pointerId);
  const mv=ev=>onMove(ev),up=ev=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);onUp(ev)};
  el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}
function bindClip(b,i,blocks){
  b.addEventListener("pointerdown",e=>{
    if(e.target.classList.contains("th"))return;
    e.preventDefault();const x0=e.clientX,w=b.offsetWidth;let moved=false;
    const mids=blocks.map(k=>k.offsetLeft+k.offsetWidth/2);
    dragHelper(b,e,ev=>{const dx=ev.clientX-x0;if(!moved&&Math.abs(dx)<6)return;moved=true;b.style.transform=`translateX(${dx}px)`;b.style.zIndex=5;b.style.opacity=.85},ev=>{
      if(!moved){playingAll=false;preview.pause();seekGlobal(xToTime(ev.clientX));return}
      const center=b.offsetLeft+w/2+(ev.clientX-x0);let ni=0;mids.forEach((m,k)=>{if(k!==i&&m<center)ni++});
      if(ni!==i){snapshot();const[c]=clips.splice(i,1);clips.splice(ni,0,c);selectedClip=ni;loadSelected()}
      renderAll();
    });
  });
}
function bindTrim(h,b,c,i,side){
  h.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();snapshot();
    const x0=e.clientX,s0=c.start,e0=c.end;
    dragHelper(h,e,ev=>{
      const d=(ev.clientX-x0)/tlScale*c.speed;
      if(side==="r")c.end=clamp(e0+d,c.start+0.1,c.duration||e0);else c.start=clamp(s0+d,0,c.end-0.1);
      b.style.width=Math.max(20,durationOf(c)*tlScale)+"px";
    },()=>{renderAll()});
  });
}
function bindScrub(el){
  el.addEventListener("pointerdown",e=>{
    if(e.target.closest(".clip-block,.wave-block,.voice-block,.sfx-block,.tl-item,#playhead"))return;
    e.preventDefault();playingAll=false;preview.pause();seekGlobal(xToTime(e.clientX));
    dragHelper(el,e,ev=>seekGlobal(xToTime(ev.clientX)),()=>{});
  });
}

function effectState(c,t,clipDuration){

    const text=b.split("\n").slice(2).join(" ").trim();if(text)out.push({text,start,end});
  }
  return out;
}
function exportSRT(){

let asrPipeline=null;
async function autoTranscribe(){
  const c=clips[selectedClip];
  if(!c){showToast("No clip","Select a clip first.");return}
  const btn=$("autoTranscribeBtn"),st=$("transcribeStatus");
  btn.disabled=true;btn.textContent="Loading model…";if(st)st.textContent="Downloading Whisper (~40MB), first run only…";
  try{
    if(!asrPipeline){
      const {pipeline}=await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
      asrPipeline=await pipeline("automatic-speech-recognition","Xenova/whisper-tiny.en");
    }
    btn.textContent="Transcribing…";if(st)st.textContent="Analysing audio…";
    const buf=await (await fetch(c.url)).arrayBuffer();
    const AC=window.AudioContext||window.webkitAudioContext;
    const ac=new AC({sampleRate:16000});
    const decoded=await ac.decodeAudioData(buf);
    const data=decoded.getChannelData(0);
    await ac.close();
    const out=await asrPipeline(data,{return_timestamps:true,chunk_length_s:30,stride_length_s:5});
    const chunks=out.chunks||[];
    if(!chunks.length){showToast("No speech","Could not detect.");return}
    snapshot();
    captions=chunks.map(ch=>({
      text:(ch.text||"").trim(),
      start:ch.timestamp?.[0]||0,
      end:ch.timestamp?.[1]||((ch.timestamp?.[0]||0)+2)
    })).filter(x=>x.text);
    selectedCaption=-1;
    renderCaptionList();renderTranscript();updateCaptionLayer();renderTimeline();
    showToast("Transcribed ✅",captions.length+" captions created.");
    if(st)st.textContent="Done. Edit captions below.";
  }catch(err){
    console.error(err);
    showToast("Transcribe failed",err.message||"Try again.");
    if(st)st.textContent="Failed: "+(err.message||"unknown");
  }finally{
    btn.disabled=false;btn.textContent="🎙️ AI Auto-Transcribe";
  }
}

async function exportMP4(){
  const muxerMod=await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm");
  const {Muxer,ArrayBufferTarget}=muxerMod;
  const[w,h]=getExportSize();
  const FPS=30;
  const total=totalDuration();
  const totalFrames=Math.ceil(total*FPS);

  const target=new ArrayBufferTarget();
  const muxer=new Muxer({
    target,
    video:{codec:"avc",width:w,height:h,frameRate:FPS},
    audio:{codec:"aac",numberOfChannels:2,sampleRate:48000},
    fastStart:"in-memory"
  });

  const bitrate=Math.round((+$("exportQuality").value||5)*1e6);
  let videoEncoder;
  try{
    const support=await VideoEncoder.isConfigSupported({codec:"avc1.42001f",width:w,height:h,bitrate,framerate:FPS});
    videoEncoder=new VideoEncoder({
      output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),
      error:e=>console.error("video enc",e)
    });
    videoEncoder.configure({codec:"avc1.42001f",width:w,height:h,bitrate,framerate:FPS,latencyMode:"quality"});
  }catch(e){throw new Error("VideoEncoder unavailable: "+e.message)}

  const audioMix=await buildMixedAudio(total);

  let audioEncoder=null;
  if(audioMix){
    try{
      const aSupport=await AudioEncoder.isConfigSupported({codec:"mp4a.40.2",sampleRate:48000,numberOfChannels:2,bitrate:128000});
      if(aSupport.supported){
        audioEncoder=new AudioEncoder({
          output:(chunk,meta)=>muxer.addAudioChunk(chunk,meta),
          error:e=>console.error("audio enc",e)
        });
        audioEncoder.configure({codec:"mp4a.40.2",sampleRate:48000,numberOfChannels:2,bitrate:128000});
      }
    }catch(e){console.warn("AudioEncoder failed",e)}
  }

  const canvas=new OffscreenCanvas(w,h);
  const ctx=canvas.getContext("2d",{alpha:false});
  const fit=$("fitMode").value;
  const timeline=[];
  let acc=0;
  for(const c of clips){const d=durationOf(c);timeline.push({clip:c,start:acc,end:acc+d});acc+=d}

  const videoEls=await Promise.all(clips.map(c=>new Promise(res=>{
    const v=document.createElement("video");
    v.src=c.url;v.muted=true;v.playsInline=true;v.preload="auto";
    v.onloadedmetadata=()=>res(v);
    v.onerror=()=>res(v);
    v.load();
  })));

  const btn=$("startExportBtn");
  for(let f=0;f<totalFrames;f++){
    const gt=f/FPS;
    let ci=timeline.findIndex(t=>gt>=t.start&&gt<t.end);
    if(ci<0)ci=timeline.length-1;
    const tinfo=timeline[ci];
    const c=tinfo.clip;
    const local=gt-tinfo.start;
    const videoT=c.start+local*c.speed;
    const v=videoEls[ci];
    if(Math.abs(v.currentTime-videoT)>0.1){
      await new Promise(res=>{v.onseeked=()=>{v.onseeked=null;res()};v.currentTime=Math.min(videoT,v.duration-0.05)});
    }
    const es=effectState(c,local,durationOf(c));
    ctx.fillStyle="#000";ctx.fillRect(0,0,w,h);
    ctx.save();
    ctx.translate(w/2+es.dx*(w/720),h/2+es.dy*(h/720));
    ctx.rotate((es.rot||0)*Math.PI/180);
    ctx.scale(es.scale,es.scale);ctx.translate(-w/2,-h/2);
    let filterStr=(c.filter==="none"?"":c.filter+" ")+"brightness("+c.brightness+"%) contrast("+c.contrast+"%) saturate("+c.saturation+"%)";
    if(es.blur>0)filterStr+=" blur("+es.blur+"px)";if(es.rgb>0)filterStr+=" drop-shadow("+es.rgb+"px 0 0 rgba(255,0,0,.35)) drop-shadow(-"+es.rgb+"px 0 0 rgba(0,255,255,.35))";
    drawVideo(ctx,v,w,h,fit,filterStr,1,c.transition,local/Math.max(0.001,c.transitionDuration||1));
    ctx.restore();
    if(es.vhs){ctx.save();ctx.globalAlpha=.18;ctx.fillStyle="#000";for(let y=0;y<h;y+=3)ctx.fillRect(0,y,w,1);ctx.restore()}
    if(es.flash>0){ctx.fillStyle=`rgba(255,255,255,${es.flash})`;ctx.fillRect(0,0,w,h)}
    stickers.forEach(s=>drawSticker(ctx,s,w,h,gt));
    texts.forEach(t=>drawText(ctx,t,gt,w,h));
    drawCaption(ctx,gt,w,h);

    const bitmap=canvas.transferToImageBitmap();
    const frame=new VideoFrame(bitmap,{timestamp:Math.round(gt*1e6),duration:Math.round((1/FPS)*1e6)});
    videoEncoder.encode(frame,{keyFrame:f%60===0});
    frame.close();
    bitmap.close();

    if(f%5===0)btn.textContent=`Rendering ${Math.round(f/totalFrames*100)}%`;
    if(f%30===0)await new Promise(r=>setTimeout(r,0));
  }
  await videoEncoder.flush();
  videoEncoder.close();

  if(audioEncoder&&audioMix){
    const sampleRate=48000;
    const ch=2;
    const left=audioMix.left,right=audioMix.right;
    const FRAME_SAMPLES=1024;
    const len=Math.min(left.length,right.length,Math.floor(total*sampleRate));
    for(let i=0;i<len;i+=FRAME_SAMPLES){
      const n=Math.min(FRAME_SAMPLES,len-i);
      const interleaved=new Float32Array(n*ch);
      for(let j=0;j<n;j++){interleaved[j*2]=left[i+j];interleaved[j*2+1]=right[i+j]}
      const audioData=new AudioData({
        format:"f32",
        sampleRate,
        numberOfFrames:n,
        numberOfChannels:ch,
        timestamp:Math.round(i/sampleRate*1e6),
        data:interleaved
      });
      audioEncoder.encode(audioData);
      audioData.close();
      if(i% (FRAME_SAMPLES*50)===0)await new Promise(r=>setTimeout(r,0));
    }
    await audioEncoder.flush();
    audioEncoder.close();
  }

  muxer.finalize();
  const blob=new Blob([target.buffer],{type:"video/mp4"});
  finishExport(blob,"mp4");
}

async function buildMixedAudio(total){
  try{
    const sampleRate=48000;
    const totalSamples=Math.ceil(total*sampleRate);
    if(totalSamples<=0)return null;
    const left=new Float32Array(totalSamples),right=new Float32Array(totalSamples);
    const AC=window.AudioContext||window.webkitAudioContext;
    const ac=new AC({sampleRate});
    let acc=0;
    const vVol=AS.videoVolume;
    for(const c of clips){
      const dur=durationOf(c);
      if(c.muted){ acc+=dur; continue; }
      const buf=await fetch(c.url).then(r=>r.arrayBuffer()).then(b=>ac.decodeAudioData(b)).catch(()=>null);
      if(buf){
        const startSample=Math.floor(acc*sampleRate);
        const len=Math.floor(dur*sampleRate);
        const L=buf.getChannelData(0);
        const R=buf.numberOfChannels>1?buf.getChannelData(1):L;
        const srcOffsetStart=Math.floor(c.start*buf.sampleRate);
        const step=buf.sampleRate/sampleRate*c.speed;
        for(let i=0;i<len;i++){
          const srcI=srcOffsetStart+Math.floor(i*step);
          if(srcI>=0&&srcI<L.length){
            left[startSample+i]+=L[srcI]*vVol;
            right[startSample+i]+=R[srcI]*vVol;
          }
        }
      }
      acc+=dur;
    }
    if(musicURL && !musicMuted){
      const buf=await fetch(musicURL).then(r=>r.arrayBuffer()).then(b=>ac.decodeAudioData(b)).catch(()=>null);
      if(buf){
        const mStart=musicStartVal();
        const startSample=Math.floor(mStart*sampleRate);
        const srcL=buf.getChannelData(0);
        const srcR=buf.numberOfChannels>1?buf.getChannelData(1):srcL;
        const step=buf.sampleRate/sampleRate;
        const mv=AS.musicVolume;
        const fi=AS.fadeIn,fo=AS.fadeOut;
        const loopLen=buf.length;
        const offS=Math.floor(AS.musicOffset*buf.sampleRate);
        for(let i=0;i<totalSamples-startSample;i++){
          let srcI=Math.floor(i*step)+offS;
          if(srcI>=loopLen)srcI=srcI%loopLen;
          if(srcI>=srcL.length)break;
          const mt=(startSample+i)/sampleRate;
          let fade=1;
          if(fi>0)fade=Math.min(fade,Math.min(1,mt/fi));
          if(fo>0)fade=Math.min(fade,Math.max(0,(total-mt)/fo));
          const g=mv*fade;
          const idx=startSample+i;
          left[idx]+=srcL[srcI]*g;
          right[idx]+=srcR[srcI]*g;
        }
      }
    }
    if(voiceoverURL && !voiceMuted){
      const buf=await fetch(voiceoverURL).then(r=>r.arrayBuffer()).then(b=>ac.decodeAudioData(b)).catch(()=>null);
      if(buf){
        const voStart=AS.voiceStart;
        const voVol=AS.voiceVolume;
        const startSample=Math.floor(voStart*sampleRate);
        const srcL=buf.getChannelData(0);
        const srcR=buf.numberOfChannels>1?buf.getChannelData(1):srcL;
        const step=buf.sampleRate/sampleRate;
        const len=Math.min(Math.floor(srcL.length/step), totalSamples-startSample);
        for(let i=0;i<len;i++){
          const srcI=Math.floor(i*step);
          if(srcI>=srcL.length)break;
          const idx=startSample+i;
          left[idx]+=srcL[srcI]*voVol;
          right[idx]+=srcR[srcI]*voVol;
        }
      }
    }
    for(const s of sfx){
      const buf=await fetch(s.url).then(r=>r.arrayBuffer()).then(b=>ac.decodeAudioData(b)).catch(()=>null);
      if(!buf)continue;
      const startSample=Math.floor(s.start*sampleRate);if(startSample>=totalSamples)continue;
      const srcL=buf.getChannelData(0),srcR=buf.numberOfChannels>1?buf.getChannelData(1):srcL;
      const step=buf.sampleRate/sampleRate,vol=s.volume??1;
      const len=Math.min(Math.floor(srcL.length/step),totalSamples-startSample);
      for(let i=0;i<len;i++){const srcI=Math.floor(i*step);left[startSample+i]+=srcL[srcI]*vol;right[startSample+i]+=srcR[srcI]*vol}
    }
    await ac.close();
    for(let i=0;i<totalSamples;i++){left[i]=clamp(left[i],-1,1);right[i]=clamp(right[i],-1,1)}
    return {left,right};
  }catch(e){console.warn("mix audio failed",e);return null}
}

async function exportWebM(){

function finishExport(blob,ext){
  lastExportBlob=blob;
  const url=URL.createObjectURL(blob);
  $("downloadLink").href=url;
  $("downloadLink").download="pikora-export."+ext;
  $("downloadLink").style.display="block";

  $("startExportBtn").textContent="✅ Done – Export Again";

  if(navigator.canShare&&navigator.canShare({files:[new File([blob],"video."+ext,{type:blob.type})]})){
    shareBtn.style.display="block";
    shareBtn.onclick=async()=>{
      try{await navigator.share({files:[new File([blob],"video."+ext,{type:blob.type})],title:"My edit"})}

function getExportSize(){const a=$("aspectRatio").value;

function textAnim(t,gt,still){

    case "slide":case "slideUp":dy=(1-ease(pin))*10;op=pin;break;

    case "slideLeft":dx=(1-ease(pin))*30;op=pin;break;

/* ---------- TIMELINE: drag text & caption bars ---------- */
function bindTlItem(d,obj,onSelect){
  d.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();
    const r=d.getBoundingClientRect();
    const edge=e.clientX-r.left<10?"l":r.right-e.clientX<10?"r":"m";
    const x0=e.clientX,s0=obj.start,e0=obj.end>0?obj.end:Math.max(totalDuration(),obj.start+2);let moved=false;
    dragHelper(d,e,ev=>{
      const px=ev.clientX-x0;if(!moved&&Math.abs(px)<4)return;
      if(!moved){snapshot();moved=true}
      const dt=px/tlScale,T=Math.max(totalDuration(),e0);
      if(edge==="m"){const len=e0-s0;const ns=clamp(s0+dt,0,Math.max(0,T-len));obj.start=+ns.toFixed(2);obj.end=+(ns+len).toFixed(2)}
      else if(edge==="l"){obj.start=+clamp(s0+dt,0,e0-.2).toFixed(2);obj.end=+e0.toFixed(2)}
      else obj.end=+clamp(e0+dt,s0+.2,T+60).toFixed(2);
      d.style.left=(10+obj.start*tlScale)+"px";d.style.width=Math.max(30,(obj.end-obj.start)*tlScale)+"px";
      updatePreviewText();updateCaptionLayer();
    },()=>{
      if(!moved){onSelect();return}
      renderTimeline();renderTextList();renderCaptionList();syncTextForm();
      showToast("Timing changed",fmt(obj.start)+"s → "+fmt(obj.end)+"s");
    });
  });
}
